<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cô Hường - Tư vấn Tâm lý Học đường</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{background:#eeeef3;overflow:hidden}

.chat-container{
  width:100%;max-width:600px;height:100dvh;margin:auto;background:#fff;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 0 30px rgba(50,40,100,.12)
}

/* Header */
.chat-header{
  flex:0 0 auto;min-height:156px;padding:24px 16px 20px;
  display:flex;align-items:center;gap:13px;color:#fff;
  background:linear-gradient(135deg,#5141e8 0%,#713be9 52%,#8b35e8 100%);
}
.avatar{
  width:60px;height:60px;min-width:60px;border-radius:50%;
  background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.28);
  display:flex;align-items:center;justify-content:center;font-size:29px;
}
.header-info{flex:1;min-width:0}
.header-info h1{font-size:25px;line-height:1.1;margin-bottom:7px;font-weight:750}
.header-info p{font-size:16px;line-height:1.35;max-width:285px}
.status{display:flex;align-items:center;gap:7px;font-size:15px;flex:0 0 auto}
.dot{width:11px;height:11px;border-radius:50%;background:#58ff70;box-shadow:0 0 10px #58ff70}

/* Messages */
.chat-messages{
  flex:1;min-height:0;overflow-y:auto;padding:38px 13px 18px;
  background:linear-gradient(#fff,#fafafa);scroll-behavior:smooth;
}
.message{display:flex;width:100%;margin-bottom:19px;animation:appear .2s ease}
@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.bot-message{justify-content:flex-start;align-items:flex-start}
.user-message{justify-content:flex-end;align-items:flex-start}
.bot-avatar{
  width:43px;height:43px;min-width:43px;margin-right:10px;border-radius:50%;
  background:#eef0ff;color:#5147dd;display:flex;align-items:center;justify-content:center;font-size:21px
}
.message-content{
  max-width:78%;padding:13px 17px;font-size:18px;line-height:1.55;
  overflow-wrap:anywhere
}
.bot-message .message-content{
  background:#fff;color:#262626;border:1px solid #e2e2e2;
  border-radius:5px 22px 22px 22px;box-shadow:0 2px 7px rgba(0,0,0,.04)
}
.user-message .message-content{
  background:linear-gradient(135deg,#6548ed,#813de7);color:#fff;
  border-radius:22px 5px 22px 22px;box-shadow:0 3px 10px rgba(100,70,220,.2)
}
.message-content p{margin-bottom:9px}
.message-content p:last-child{margin-bottom:0}

/* Suggestions */
.quick-replies{
  flex:0 0 auto;padding:13px 18px 9px;background:#fff;border-top:1px solid #eee;
  display:flex;flex-direction:column;align-items:flex-start;gap:9px
}
.reply-btn{
  border:1px solid #ddd;border-radius:26px;background:linear-gradient(#fff,#f7f7f7);
  padding:10px 17px;min-height:47px;color:#303030;font-size:16px;cursor:pointer;
  box-shadow:0 1px 3px rgba(0,0,0,.04)
}
.reply-btn:active{transform:scale(.97)}
.reply-btn .ico{margin-right:7px}

/* Input */
.input-area{
  flex:0 0 auto;display:flex;gap:9px;padding:9px 14px;
  background:#fff;border-top:1px solid #eee;padding-bottom:max(9px,env(safe-area-inset-bottom))
}
#messageInput{
  flex:1;min-width:0;height:48px;border:1px solid #ddd;border-radius:25px;
  outline:none;padding:0 17px;font-size:16px;color:#333;background:#fff
}
#messageInput:focus{border-color:#7254ed;box-shadow:0 0 0 3px rgba(114,84,237,.09)}
.send-btn{
  width:48px;height:48px;min-width:48px;border:0;border-radius:50%;
  background:linear-gradient(135deg,#6249ed,#833ee8);color:#fff;font-size:20px;cursor:pointer
}
.send-btn:active{transform:scale(.94)}
.send-btn:disabled{opacity:.55}

/* Footer */
.footer-note{text-align:center;background:#fff;color:#999;font-size:11px;padding:4px 10px 7px}
.heart{color:#e86b99}

/* Typing */
.typing{display:flex;gap:5px;align-items:center;min-height:40px}
.typing i{display:block;width:7px;height:7px;background:#999;border-radius:50%;animation:bounce 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}

@media(max-width:600px){
  .chat-container{max-width:none}
  .chat-header{min-height:156px;padding:20px 13px}
  .avatar{width:58px;height:58px;min-width:58px}
  .header-info h1{font-size:24px}
  .header-info p{font-size:16px}
  .status{font-size:14px;max-width:62px}
  .message-content{font-size:18px;max-width:79%}
}
@media(max-width:380px){
  .header-info h1{font-size:21px}.header-info p{font-size:14px}
  .status{font-size:12px}.message-content{font-size:16px}
  .reply-btn{font-size:14px}
}
</style>
</head>

<body>
<div class="chat-container">

  <header class="chat-header">
    <div class="avatar">👩‍⚕️</div>
    <div class="header-info">
      <h1>Cô Hường</h1>
      <p>Giáo viên Tư vấn Tâm lý Học đường</p>
    </div>
    <div class="status"><span class="dot"></span><span>Trực<br>tuyến</span></div>
  </header>

  <main class="chat-messages" id="chatMessages">
    <div class="message bot-message">
      <div class="bot-avatar">👩‍⚕️</div>
      <div class="message-content">
        <p>Chào em! 👋 Cô Hường rất vui được trò chuyện cùng em!</p>
        <p>Nếu em có bất kỳ khó khăn, lo lắng nào trong học tập, bạn bè, gia đình hay cảm xúc, hãy chia sẻ với cô nhé 💜</p>
      </div>
    </div>
  </main>

  <div class="quick-replies">
    <button class="reply-btn" data-message="Em muốn được tư vấn"><span class="ico">💡</span>Tôi muốn được tư vấn</button>
    <button class="reply-btn" data-message="Em đang gặp khó khăn"><span class="ico">🤲</span>Tôi đang gặp khó khăn</button>
    <button class="reply-btn" data-message="Em muốn tâm sự"><span class="ico">♥</span>Tôi muốn tâm sự</button>
  </div>

  <div class="input-area">
    <input id="messageInput" type="text" placeholder="Nhập câu hỏi của em..." autocomplete="off">
    <button class="send-btn" id="sendBtn" aria-label="Gửi">➤</button>
  </div>

  <div class="footer-note"><span class="heart">♥</span> Cô Hường • Luôn lắng nghe và đồng hành cùng em</div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const messages = document.getElementById("chatMessages");
  const input = document.getElementById("messageInput");
  const send = document.getElementById("sendBtn");

  const knowledge = [
    [["chao","xin chao","hello","hi"],"Chào em! 👋 Cô Hường rất vui được trò chuyện cùng em. Em muốn chia sẻ điều gì với cô hôm nay?"],
    [["tu van","tam su","kho khan"],"Được chứ em. 💜 Cô Hường đang lắng nghe em đây. Em cứ chia sẻ điều khiến em lo lắng hoặc khó khăn, cô sẽ cùng em tìm cách giải quyết."],
    [["buon","chan","met moi","khong vui"],"Cô hiểu, có những lúc mình cảm thấy rất buồn hoặc mệt mỏi. 🌷 Em có thể kể cho cô biết điều gì đang khiến em cảm thấy như vậy không?"],
    [["stress","cang thang","ap luc"],"Cảm giác căng thẳng và áp lực có thể khiến mình rất mệt. Em hãy thử nghỉ một chút, hít thở chậm và chia nhỏ những việc cần làm. Em có thể kể cô nghe điều gì đang tạo áp lực cho em nhé."],
    [["hoc","hoc tap","bai","diem","thi","kiem tra"],"Cô hiểu việc học đôi khi có thể tạo rất nhiều áp lực. 📚 Một điểm số không quyết định giá trị của em. Em đang gặp khó khăn ở môn học, bài kiểm tra hay áp lực từ điểm số?"],
    [["ban","ban be","mau thuan","cai nhau"],"Mâu thuẫn với bạn bè có thể khiến mình buồn và khó xử. 💜 Em có thể kể cho cô nghe chuyện gì đã xảy ra không?"],
    [["gia dinh","bo me","ba me","cha me"],"Cô đang lắng nghe em. 🌷 Những chuyện trong gia đình đôi khi khiến chúng ta có rất nhiều cảm xúc. Em có thể kể cho cô biết điều gì đang xảy ra."],
    [["lo","lo lang","so"],"Cô hiểu cảm giác lo lắng có thể rất khó chịu. Em hãy nói cho cô biết điều gì đang khiến em lo nhất, chúng ta sẽ cùng tìm cách tháo gỡ từng bước nhé."],
    [["co don","mot minh"],"Cảm giác cô đơn thật không dễ chịu. 💜 Em không nhất thiết phải giữ mọi chuyện trong lòng. Hãy kể cho cô nghe điều gì khiến em cảm thấy như vậy."],
    [["cam on","thank"],"Không có gì đâu em. 🌷 Khi cần chia sẻ, em có thể quay lại trò chuyện cùng cô."]
  ];

  function normalize(s){
    return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d");
  }

  function escapeHtml(s){
    const d=document.createElement("div"); d.textContent=s; return d.innerHTML;
  }

  function scrollBottom(){
    requestAnimationFrame(()=>{messages.scrollTop=messages.scrollHeight});
  }

  function addMessage(text,type){
    const el=document.createElement("div");
    el.className="message "+(type==="user"?"user-message":"bot-message");
    if(type==="bot"){
      el.innerHTML='<div class="bot-avatar">👩‍⚕️</div><div class="message-content">'+text+'</div>';
    }else{
      el.innerHTML='<div class="message-content">'+escapeHtml(text)+'</div>';
    }
    messages.appendChild(el);
    scrollBottom();
  }

  function showTyping(){
    const el=document.createElement("div");
    el.className="message bot-message";
    el.id="typingMessage";
    el.innerHTML='<div class="bot-avatar">👩‍⚕️</div><div class="message-content typing"><i></i><i></i><i></i></div>';
    messages.appendChild(el); scrollBottom();
  }

  function answer(text){
    const q=normalize(text);
    let best=null, score=0;
    for(const [keys,reply] of knowledge){
      let n=0;
      for(const k of keys) if(q.includes(k)) n++;
      if(n>score){score=n;best=reply;}
    }
    return best || "<p>Cô Hường đang lắng nghe em 💜</p><p>Cô chưa hiểu thật rõ điều em đang muốn chia sẻ. Em có thể nói cụ thể hơn một chút được không?</p><p>Em có thể nói về học tập, bạn bè, gia đình, cảm xúc, áp lực hoặc điều gì đang khiến em lo lắng.</p>";
  }

  function sendMessage(){
    const text=input.value.trim();
    if(!text) return;
    addMessage(text,"user");
    input.value="";
    send.disabled=true;
    showTyping();
    setTimeout(()=>{
      document.getElementById("typingMessage")?.remove();
      addMessage(answer(text),"bot");
      send.disabled=false;
      input.focus();
    },650);
  }

  send.addEventListener("click",sendMessage);
  input.addEventListener("keydown",e=>{
    if(e.key==="Enter"){e.preventDefault();sendMessage();}
  });

  document.querySelectorAll(".reply-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      input.value=btn.dataset.message;
      sendMessage();
    });
  });
});
</script>
</body>
</html>
