<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cô Hường - Tư vấn Tâm lý Học đường</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{background:#eeeef3;overflow:hidden}

.chat-container{
  width:100%;max-width:600px;height:100dvh;margin:auto;background:#fff;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 0 30px rgba(50,40,100,.12)
}

/* Header */
.chat-header{
  flex:0 0 auto;min-height:156px;padding:24px 16px 20px;
  display:flex;align-items:center;gap:13px;color:#fff;
  background:linear-gradient(135deg,#5141e8 0%,#713be9 52%,#8b35e8 100%);
}
.avatar{
  width:60px;height:60px;min-width:60px;border-radius:50%;
  background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.28);
  display:flex;align-items:center;justify-content:center;font-size:29px;
}
.header-info{flex:1;min-width:0}
.header-info h1{font-size:25px;line-height:1.1;margin-bottom:7px;font-weight:750}
.header-info p{font-size:16px;line-height:1.35;max-width:285px}
.status{display:flex;align-items:center;gap:7px;font-size:15px;flex:0 0 auto}
.dot{width:11px;height:11px;border-radius:50%;background:#58ff70;box-shadow:0 0 10px #58ff70}

/* Messages */
.chat-messages{
  flex:1;min-height:0;overflow-y:auto;padding:38px 13px 18px;
  background:linear-gradient(#fff,#fafafa);scroll-behavior:smooth;
}
.message{display:flex;width:100%;margin-bottom:19px;animation:appear .2s ease}
@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.bot-message{justify-content:flex-start;align-items:flex-start}
.user-message{justify-content:flex-end;align-items:flex-start}
.bot-avatar{
  width:43px;height:43px;min-width:43px;margin-right:10px;border-radius:50%;
  background:#eef0ff;color:#5147dd;display:flex;align-items:center;justify-content:center;font-size:21px
}
.message-content{
  max-width:78%;padding:13px 17px;font-size:18px;line-height:1.55;
  overflow-wrap:anywhere
}
.bot-message .message-content{
  background:#fff;color:#262626;border:1px solid #e2e2e2;
  border-radius:5px 22px 22px 22px;box-shadow:0 2px 7px rgba(0,0,0,.04)
}
.user-message .message-content{
  background:linear-gradient(135deg,#6548ed,#813de7);color:#fff;
  border-radius:22px 5px 22px 22px;box-shadow:0 3px 10px rgba(100,70,220,.2)
}
.message-content p{margin-bottom:9px}
.message-content p:last-child{margin-bottom:0}

/* Suggestions */
.quick-replies{
  flex:0 0 auto;padding:13px 18px 9px;background:#fff;border-top:1px solid #eee;
  display:flex;flex-direction:column;align-items:flex-start;gap:9px
}
.reply-btn{
  border:1px solid #ddd;border-radius:26px;background:linear-gradient(#fff,#f7f7f7);
  padding:10px 17px;min-height:47px;color:#303030;font-size:16px;cursor:pointer;
  box-shadow:0 1px 3px rgba(0,0,0,.04)
}
.reply-btn:active{transform:scale(.97)}
.reply-btn .ico{margin-right:7px}

/* Input */
.input-area{
  flex:0 0 auto;display:flex;gap:9px;padding:9px 14px;
  background:#fff;border-top:1px solid #eee;padding-bottom:max(9px,env(safe-area-inset-bottom))
}
#messageInput{
  flex:1;min-width:0;height:48px;border:1px solid #ddd;border-radius:25px;
  outline:none;padding:0 17px;font-size:16px;color:#333;background:#fff
}
#messageInput:focus{border-color:#7254ed;box-shadow:0 0 0 3px rgba(114,84,237,.09)}
.send-btn{
  width:48px;height:48px;min-width:48px;border:0;border-radius:50%;
  background:linear-gradient(135deg,#6249ed,#833ee8);color:#fff;font-size:20px;cursor:pointer
}
.send-btn:active{transform:scale(.94)}
.send-btn:disabled{opacity:.55}

/* Footer */
.footer-note{text-align:center;background:#fff;color:#999;font-size:11px;padding:4px 10px 7px}
.heart{color:#e86b99}

/* Typing */
.typing{display:flex;gap:5px;align-items:center;min-height:40px}
.typing i{display:block;width:7px;height:7px;background:#999;border-radius:50%;animation:bounce 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}


.counselor-info{
  margin-bottom:12px;padding:12px 13px;border-radius:14px;
  background:linear-gradient(135deg,#f3f1ff,#faf8ff);
  border:1px solid #ddd6ff;color:#34305a;font-size:15px;line-height:1.55;
}
.counselor-info div{margin:2px 0}
.counselor-info a{color:#5d45d9;text-decoration:none;font-weight:600}
.counselor-info a:hover{text-decoration:underline}

@media(max-width:600px){
  .chat-container{max-width:none}
  .chat-header{min-height:156px;padding:20px 13px}
  .avatar{width:58px;height:58px;min-width:58px}
  .header-info h1{font-size:24px}
  .header-info p{font-size:16px}
  .status{font-size:14px;max-width:62px}
  .message-content{font-size:18px;max-width:79%}
}
@media(max-width:380px){
  .header-info h1{font-size:21px}.header-info p{font-size:14px}
  .status{font-size:12px}.message-content{font-size:16px}
  .reply-btn{font-size:14px}
}
</style>
</head>

<body>
<div class="chat-container">

  <header class="chat-header">
    <div class="avatar">👩‍⚕️</div>
    <div class="header-info">
      <h1>Cô Hường</h1>
      <p>Giáo Viên Tư vấn Tâm lý Học đường</p>
    </div>
    <div class="status"><span class="dot"></span><span>Trực<br>tuyến</span></div>
  </header>

  <main class="chat-messages" id="chatMessages">
    <div class="message bot-message">
      <div class="bot-avatar">👩‍⚕️</div>
      <div class="message-content">
        <p>Chào em! 👋 Cô Hường rất vui được trò chuyện cùng em!</p>
        <p>Nếu em có bất kỳ khó khăn, lo lắng nào trong học tập, bạn bè, gia đình hay cảm xúc, hãy chia sẻ với cô nhé 💜</p>
      </div>
    </div>
  </main>

  <div class="quick-replies">
    <button class="reply-btn" data-message="Em muốn được tư vấn"><span class="ico">💡</span>Tôi muốn được tư vấn</button>
    <button class="reply-btn" data-message="Em đang gặp khó khăn"><span class="ico">🤲</span>Tôi đang gặp khó khăn</button>
    <button class="reply-btn" data-message="Em muốn tâm sự"><span class="ico">♥</span>Tôi muốn tâm sự</button>
  </div>

  <div class="input-area">
    <input id="messageInput" type="text" placeholder="Nhập câu hỏi của em..." autocomplete="off">
    <button class="send-btn" id="sendBtn" aria-label="Gửi">➤</button>
  </div>

  <div class="footer-note"><span class="heart">♥</span> Cô Hường • Luôn lắng nghe và đồng hành cùng em</div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const messages = document.getElementById("chatMessages");
  const input = document.getElementById("messageInput");
  const send = document.getElementById("sendBtn");

  const knowledge = [{"id":0,"q":"chào xin chào hello hi","a":"Chào em! 👋 Cô Hường rất vui được trò chuyện cùng em. Em muốn chia sẻ điều gì với cô hôm nay?"},{"id":0,"q":"em muốn được tư vấn em muốn tâm sự em đang gặp khó khăn","a":"Được chứ em. 💜 Cô Hường đang lắng nghe em đây. Em cứ chia sẻ điều khiến em lo lắng hoặc khó khăn, cô sẽ cùng em tìm cách tháo gỡ từng bước."},{"id":0,"q":"cảm ơn cô cảm ơn","a":"Không có gì đâu em. 🌷 Khi cần chia sẻ, em có thể tiếp tục trò chuyện cùng cô."},{"id":1,"q":"Em hay buồn vô cớ là sao ạ?","a":"Cô cảm ơn em đã nói ra điều mình đang trải qua. Có thể do căng thẳng hoặc thay đổi tuổi dậy thì. Cảm xúc của em đáng được lắng nghe; em không cần tự trách mình vì đang buồn, lo lắng hay tức giận. Em có thể thử gọi tên cảm xúc, hít thở chậm, viết ra điều khiến mình khó chịu và chọn một người đáng tin để chia sẻ. Nếu tình trạng kéo dài, ảnh hưởng giấc ngủ, ăn uống, học tập hoặc khiến em thấy không an toàn, hãy báo cho người lớn và tìm hỗ trợ trực tiếp. Em muốn kể cô nghe chuyện gì thường xảy ra trước khi em có cảm giác này không? Cô Hường có thể lắng nghe qua số 0989836893."},{"id":2,"q":"Tại sao em dễ cáu gắt?","a":"Cô cảm ơn em đã nói ra điều mình đang trải qua. Khi mệt mỏi hoặc áp lực, cảm xúc tiêu cực dễ xuất hiện. Cảm xúc của em đáng được lắng nghe; em không cần tự trách mình vì đang buồn, lo lắng hay tức giận. Em có thể thử gọi tên cảm xúc, hít thở chậm, viết ra điều khiến mình khó chịu và chọn một người đáng tin để chia sẻ. Nếu tình trạng kéo dài, ảnh hưởng giấc ngủ, ăn uống, học tập hoặc khiến em thấy không an toàn, hãy báo cho người lớn và tìm hỗ trợ trực tiếp. Em muốn kể cô nghe chuyện gì thường xảy ra trước khi em có cảm giác này không? Cô Hường có thể lắng nghe qua số 0989836893."},{"id":3,"q":"Em không hiểu mình đang cảm thấy gì?","a":"Cô cảm ơn em đã đặt câu hỏi. Hãy thử viết ra điều đang xảy ra và suy nghĩ của em. Em hãy thử áp dụng từng bước nhỏ, phù hợp với hoàn cảnh của mình; không cần phải giải quyết mọi việc ngay lập tức. Nếu đã cố gắng mà vẫn thấy khó khăn, em có thể tìm đến cha mẹ, giáo viên chủ nhiệm hoặc người lớn em tin tưởng để cùng tìm cách giải quyết. Em có thể chia sẻ thêm tình huống cụ thể để cô tư vấn sát với điều em đang gặp phải. Cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công, số 0989836893."},{"id":4,"q":"Buồn và trầm cảm khác nhau thế nào?","a":"Cô cảm ơn em đã nói ra điều mình đang trải qua. Buồn là tạm thời; trầm cảm kéo dài và ảnh hưởng sinh hoạt. Cảm xúc của em đáng được lắng nghe; em không cần tự trách mình vì đang buồn, lo lắng hay tức giận. Em có thể thử gọi tên cảm xúc, hít thở chậm, viết ra điều khiến mình khó chịu và chọn một người đáng tin để chia sẻ. Nếu tình trạng kéo dài, ảnh hưởng giấc ngủ, ăn uống, học tập hoặc khiến em thấy không an toàn, hãy báo cho người lớn và tìm hỗ trợ trực tiếp. Em muốn kể cô nghe chuyện gì thường xảy ra trước khi em có cảm giác này không? Cô Hường có thể lắng nghe qua số 0989836893."},{"id":5,"q":"Em thấy mình vô dụng?","a":"Cô cảm ơn em đã nói ra điều mình đang trải qua. Đó là suy nghĩ tiêu cực, không phải sự thật về em. Cảm xúc của em đáng được lắng nghe; em không cần tự trách mình vì đang buồn, lo lắng hay tức giận. Em có thể thử gọi tên cảm xúc, hít thở chậm, viết ra điều khiến mình khó chịu và chọn một người đáng tin để chia sẻ. Nếu tình trạng kéo dài, ảnh hưởng giấc ngủ, ăn uống, học tập hoặc khiến em thấy không an toàn, hãy báo cho người lớn và tìm hỗ trợ trực tiếp. Em muốn kể cô nghe chuyện gì thường xảy ra trước khi em có cảm giác này không? Cô Hường có thể lắng nghe qua số 0989836893."},{"id":6,"q":"Em hay lo lắng quá mức?","a":"Cô cảm ơn em đã nói ra điều mình đang trải qua. Lo lắng nhiều thường do thiếu cảm giác an toàn. Cảm xúc của em đáng được lắng nghe; em không cần tự trách mình vì đang buồn, lo lắng hay tức giận. Em có thể thử gọi tên cảm xúc, hít thở chậm, viết ra điều khiến mình khó chịu và chọn một người đáng tin để chia sẻ. Nếu tình trạng kéo dài, ảnh hưởng giấc ngủ, ăn uống, học tập hoặc khiến em thấy không an toàn, hãy báo cho người lớn và tìm hỗ trợ trực tiếp. Em muốn kể cô nghe chuyện gì thường xảy ra trước khi em có cảm giác này không? Cô Hường có thể lắng nghe qua số 0989836893."},{"id":7,"q":"Làm sao biết mình đang stress?","a":"Cô cảm ơn em đã nói ra điều mình đang trải qua. Mất ngủ, đau đầu, khó tập trung. Cảm xúc của em đáng được lắng nghe; em không cần tự trách mình vì đang buồn, lo lắng hay tức giận. Em có thể thử gọi tên cảm xúc, hít thở chậm, viết ra điều khiến mình khó chịu và chọn một người đáng tin để chia sẻ. Nếu tình trạng kéo dài, ảnh hưởng giấc ngủ, ăn uống, học tập hoặc khiến em thấy không an toàn, hãy báo cho người lớn và tìm hỗ trợ trực tiếp. Em muốn kể cô nghe chuyện gì thường xảy ra trước khi em có cảm giác này không? Cô Hường có thể lắng nghe qua số 0989836893."},{"id":8,"q":"Em hay khóc có yếu đuối không?","a":"Cô cảm ơn em đã nói ra điều mình đang trải qua. Không, khóc là cách giải tỏa cảm xúc. Cảm xúc của em đáng được lắng nghe; em không cần tự trách mình vì đang buồn, lo lắng hay tức giận. Em có thể thử gọi tên cảm xúc, hít thở chậm, viết ra điều khiến mình khó chịu và chọn một người đáng tin để chia sẻ. Nếu tình trạng kéo dài, ảnh hưởng giấc ngủ, ăn uống, học tập hoặc khiến em thấy không an toàn, hãy báo cho người lớn và tìm hỗ trợ trực tiếp. Em muốn kể cô nghe chuyện gì thường xảy ra trước khi em có cảm giác này không? Cô Hường có thể lắng nghe qua số 0989836893."},{"id":9,"q":"Em thấy cô đơn dù có bạn?","a":"Cô nghe được rằng chuyện này có thể làm em buồn hoặc khó xử. Có thể em chưa chia sẻ cảm xúc thật của mình. Nếu cảm thấy an toàn, em hãy chọn lúc cả hai bình tĩnh để nói bằng câu bắt đầu từ cảm xúc của mình, chẳng hạn: “Mình buồn khi… và mong…”. Hãy lắng nghe phía bạn nhưng cũng giữ ranh giới; em không cần chấp nhận việc xúc phạm, ép buộc hay làm tổn thương mình chỉ để giữ tình bạn. Em có thể chia sẻ thêm chuyện đã xảy ra như thế nào không? Cô Hường sẵn sàng lắng nghe em qua số 0989836893."},{"id":10,"q":"Vì sao em hay suy nghĩ tiêu cực?","a":"Cô cảm ơn em đã đặt câu hỏi. Khi áp lực cao, não dễ tập trung vào điều xấu. Em hãy thử áp dụng từng bước nhỏ, phù hợp với hoàn cảnh của mình; không cần phải giải quyết mọi việc ngay lập tức. Nếu đã cố gắng mà vẫn thấy khó khăn, em có thể tìm đến cha mẹ, giáo viên chủ nhiệm hoặc người lớn em tin tưởng để cùng tìm cách giải quyết. Em có thể chia sẻ thêm tình huống cụ thể để cô tư vấn sát với điều em đang gặp phải. Cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công, số 0989836893."},{"id":11,"q":"Làm sao để bớt giận?","a":"Cô cảm ơn em đã nói ra điều mình đang trải qua. Hít sâu 5 lần và tạm rời khỏi tình huống. Cảm xúc của em đáng được lắng nghe; em không cần tự trách mình vì đang buồn, lo lắng hay tức giận. Em có thể thử gọi tên cảm xúc, hít thở chậm, viết ra điều khiến mình khó chịu và chọn một người đáng tin để chia sẻ. Nếu tình trạng kéo dài, ảnh hưởng giấc ngủ, ăn uống, học tập hoặc khiến em thấy không an toàn, hãy báo cho người lớn và tìm hỗ trợ trực tiếp. Em muốn kể cô nghe chuyện gì thường xảy ra trước khi em có cảm giác này không? Cô Hường có thể lắng nghe qua số 0989836893."},{"id":12,"q":"Em nóng tính quá thì sao?","a":"Cô cảm ơn em đã đặt câu hỏi. Luyện thói quen dừng lại trước khi phản ứng. Em hãy thử áp dụng từng bước nhỏ, phù hợp với hoàn cảnh của mình; không cần phải giải quyết mọi việc ngay lập tức. Nếu đã cố gắng mà vẫn thấy khó khăn, em có thể tìm đến cha mẹ, giáo viên chủ nhiệm hoặc người lớn em tin tưởng để cùng tìm cách giải quyết. Em có thể chia sẻ thêm tình huống cụ thể để cô tư vấn sát với điều em đang gặp phải. Cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công, số 0989836893."},{"id":13,"q":"Làm sao bình tĩnh khi bị chê?","a":"Cô cảm ơn em đã đặt câu hỏi. Nhắc mình rằng lời chê không quyết định giá trị của em. Em hãy thử áp dụng từng bước nhỏ, phù hợp với hoàn cảnh của mình; không cần phải giải quyết mọi việc ngay lập tức. Nếu đã cố gắng mà vẫn thấy khó khăn, em có thể tìm đến cha mẹ, giáo viên chủ nhiệm  để cùng tìm cách giải quyết. Em có thể chia sẻ thêm tình huống cụ thể để cô tư vấn sát với điều em đang gặp phải. Cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công, số 0989836893."},{"id":432,"q":"Bạn ấy đòi xem tin nhắn riêng của em?","a":"Cô nghe được rằng chuyện này có thể làm em buồn hoặc khó xử. Em có quyền giữ riêng tư. Nếu cảm thấy an toàn, em hãy chọn lúc cả hai bình tĩnh để nói bằng câu bắt đầu từ cảm xúc của mình, chẳng hạn: “Mình buồn khi… và mong…”. Hãy lắng nghe phía bạn nhưng cũng giữ ranh giới; em không cần chấp nhận việc xúc phạm, ép buộc hay làm tổn thương mình chỉ để giữ tình bạn. Em có thể chia sẻ thêm chuyện đã xảy ra như thế nào không? Cô Hường sẵn sàng lắng nghe em qua số 0989836893."},{"id":433,"q":"Em bị ép làm điều không muốn?","a":"Cô rất cảm ơn em đã tin tưởng chia sẻ. Cô muốn hiểu rõ hơn: chuyện này xảy ra khi nào, ở đâu và hiện giờ em có đang ở nơi an toàn không? Điều quan trọng nhất là em không phải tự giải quyết một mình. Nếu nguy hiểm đang xảy ra, hãy đi đến nơi có người lớn, tránh gặp riêng người đe dọa và báo ngay cho cha mẹ, giáo viên chủ nhiệm hoặc Ban giám hiệu; giữ lại tin nhắn/hình ảnh làm bằng chứng nếu an toàn, không tự đối đầu hay trả đũa. Em có thể liên hệ cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công qua số 0989836893 để được hỗ trợ trực tiếp. Nếu có nguy cơ tức thời, hãy nhờ người lớn gọi cơ quan chức năng/cấp cứu phù hợp ngay."},{"id":434,"q":"Em nên làm gì khi bị ghen quá mức?","a":"Cô hiểu những cảm xúc này có thể rất mới mẻ và đôi khi khiến em bối rối. Ghen không nên biến thành kiểm soát. Em không cần vội quyết định hay làm điều mình chưa sẵn sàng. Hãy tôn trọng cảm xúc, sự riêng tư và ranh giới của cả hai; không gửi ảnh riêng tư, không để ai ép buộc hoặc kiểm soát em, và vẫn giữ cân bằng với học tập, bạn bè, gia đình. Em có thể kể thêm điều khiến em băn khoăn nhất để cô cùng em tìm cách ứng xử phù hợp. Nếu muốn trao đổi riêng, em có thể liên hệ cô Hường qua số 0989836893."},{"id":435,"q":"Em có n hấy mình trưởng thành hơn?","a":"Cô cảm ơn em đã đặt câu hỏi. Tình cảm giúp em hiểu bản thân. Em hãy thử áp dụng từng bước nhỏ, phù hợp với hoàn cảnh của mình; không cần phải giải quyết mọi việc ngay lập tức. Nếu đã cố gắng mà vẫn thấy khó khăn, em có thể tìm đến cha mẹ, giáo viên chủ nhiệm hoặc người lớn em tin tưởng để cùng tìm cách giải quyết. Em có thể chia sẻ thêm tình huống cụ thể để cô tư vấn sát với điều em đang gặp phải. Cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công, số 0989836893."},{"id":447,"q":"Em có nên hỏi ý kiến người lớn?","a":"Cô cảm ơn em đã đặt câu hỏi. Có, khi em cảm thấy bối rối. Em hãy thử áp dụng từng bước nhỏ, phù hợp với hoàn cảnh của mình; không cần phải giải quyết mọi việc ngay lập tức. Nếu đã cố gắng mà vẫn thấy khó khăn, em có thể tìm đến cha mẹ, giáo viên chủ nhiệm hoặc người lớn em tin tưởng để cùng tìm cách giải quyết. Em có thể chia sẻ thêm tình huống cụ thể để cô tư vấn sát với điều em đang gặp phải. Cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công, số 0989836893."},{"id":448,"q":"Em thấy khó hiểu cảm xúc của mình?","a":"Cô cảm ơn em đã đặt câu hỏi. Viết nhật ký giúp em rõ ràng hơn. Em hãy thử áp dụng từng bước nhỏ, phù hợp với hoàn cảnh của mình; không cần phải giải quyết mọi việc ngay lập tức. Nếu đã cố gắng mà vẫn thấy khó khăn, em có thể tìm đến cha mẹ, giáo viên chủ nhiệm hoặc người lớn em tin tưởng để cùng tìm cách giải quyết. Em có thể chia sẻ thêm tình huống cụ thể để cô tư vấn sát với điều em đang gặp phải. Cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công, số 0989836893."},{"id":449,"q":"Em sợ bị đánh giá vì có tình cảm?","a":"Cô rất cảm ơn em đã tin tưởng chia sẻ. Cô muốn hiểu rõ hơn: chuyện này xảy ra khi nào, ở đâu và hiện giờ em có đang ở nơi an toàn không? Điều quan trọng nhất là em không phải tự giải quyết một mình. Nếu nguy hiểm đang xảy ra, hãy đi đến nơi có người lớn, tránh gặp riêng người đe dọa và báo ngay cho cha mẹ, giáo viên chủ nhiệm hoặc Ban giám hiệu; giữ lại tin nhắn/hình ảnh ô cảm ơn em đã đặt câu hỏi. Động lực giúp tiến bộ tích cực, còn áp lực khiến sợ hãi và mệt mỏi. Em hãy thử áp dụng từng bước nhỏ, phù hợp với hoàn cảnh của mình; không cần phải giải quyết mọi việc ngay lập tức. Nếu đã cố gắng mà vẫn thấy khó khăn, em có thể tìm đến cha mẹ, giáo viên chủ nhiệm hoặc người lớn em tin tưởng để cùng tìm cách giải quyết. Em có thể chia sẻ thêm tình huống cụ thể để cô tư vấn sát với điều em đang gặp phải. Cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công, số 0989836893."},{"id":612,"q":"Thi cử có quyết định toàn bộ tương lai không?","a":"Cô hiểu rằng điều này có thể khiến em mệt mỏi hoặc lo lắng. Không. Một kỳ thi không định nghĩa giá trị của bạn. Em thử bắt đầu bằng một việc nhỏ, cụ thể hôm nay: chia nhiệm vụ thành từng phần, ưu tiên việc quan trọng nhất và dành thời gian nghỉ ngắn, ngủ đủ. Nếu vấn đề liên quan đến điểm số hay kỳ vọng của gia đình, em có thể nói với cha mẹ hoặc thầy cô về điều em đang gặp khó khăn và đề nghị cùng lập kế hoạch phù hợp. Em kể cô nghe điều gì đang làm em áp lực nhất nhé; cô Hường cũng sẵn sàng lắng nghe qua số 0989836893."},{"id":613,"q":"Mất tự tin trước thi có phổ biến không?","a":"Cô hiểu rằng điều này có thể khiến em mệt mỏi hoặc lo lắng. Có. Nhiều học sinh nghi ngờ khả năng của mình dù đã chuẩn bị tốt. Em thử bắt đầu bằng một việc nhỏ, cụ thể hôm nay: chia nhiệm vụ thành từng phần, ưu tiên việc quan trọng nhất và dành thời gian nghỉ ngắn, ngủ đủ. Nếu vấn đề liên quan đến điểm số hay kỳ vọng của gia đình, em có thể nói với cha mẹ hoặc thầy cô về điều em đang gặp khó khăn và đề nghị cùng lập kế hoạch phù hợp. Em kể cô nghe điều gì đang làm em áp lực nhất nhé; cô Hường cũng sẵn sàng lắng nghe qua số 0989836893."},{"id":614,"q":"Suy nghĩ “mình chắc chắn trượt” có nguy hiểm không?","a":"Cô cảm ơn em đã đặt câu hỏi. Có. Suy nghĩ tiêu cực làm giảm hiệu suất thực tế. Em hãy thử áp dụng từng bước nhỏ, phù hợp với hoàn cảnh của mình; không cần phải giải quyết mọi việc ngay lập tức. Nếu đã cố gắng mà vẫn thấy khó khăn, em có thể tìm đến cha mẹ, giáo viên chủ nhiệm hoặc người lớn em tin tưởng để cùng tìm cách giải quyết. Em có thể chia sẻ thêm tình huống cụ thể để cô tư vấn sát với điều em đang gặp phải. Cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công, số 0989836893."},{"id":615,"q":"Áp lực kéo dài có ảnh hưởng sức khỏe không?","a":"Cô cảm ơn em đã đặt câu hỏi. Có. Có thể gây mệt mỏi, đau dạ dày, giảm miễn dịch. Em hãy thử áp dụng từng bước nhỏ, phù hợp với hoàn cảnh của mình; không cần phải giải quyết mọi việc ngay lập tức. Nếu đã cố gắng mà vẫn thấy khó khăn, em có thể tìm đến cha mẹ, giáo viên chủ nhiệm hoặc người lớn em tin tưởng để cùng tìm cách giải quyết. Em có thể chia sẻ thêm tình huống cụ thể để cô tư vấn sát với điều em đang gặp phải. Cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công, số 0989836893."},{"id":616,"q":"Ngủ ít để học thêm có nên không?","a":"Cô hiểu rằng điều này có thể khiến em mệt mỏi hoặc lo lắng. Không. Giấc ngủ giúp củng cố trí nhớ. Em thử bắt đầu bằng một việc nhỏ, cụ thể hôm nay: chia nhiệm vụ thành từng phần, ưu tiên việc quan trọng nhất và dành thời gian nghỉ ngắn, ngủ đủ. Nếu vấn đề liên quan đến điểm số hay kỳ vọng của gia đình, em có thể nói với cha mẹ hoặc thầy cô về điều em đang gặp khó khăn và đề nghị cùng lập kế hoạch phù hợp. Em kể cô nghe điều gì đang làm em áp lực nhất nhé; cô Hường cũng sẵn sàng lắng nghe qua số 0989836893."},{"id":617,"q":"Cảm giác run tay khi thi có bình thường không?","a":"Cô hiểu rằng điều này có thể khiến em mệt mỏi hoặc lo lắng. Có. Đó là phản ứng sinh lý khi lo lắng. Em thử bắt đầu bằng một việc nhỏ, cụ thể hôm nay: chia nhiệm vụ thành từng phần, ưu tiên việc quan trọng nhất và dành thời gian nghỉ ngắn, ngủ đủ. Nếu vấn đề liên quan đến điểm số hay kỳ vọng của gia đình, em có thể nói với cha mẹ hoặc thầy cô về điều em đang gặp khó khăn và đề nghị cùng lập kế hoạch phù hợp. Em kể cô nghe điều gì đang làm em áp lực nhất nhé; cô Hường cũng sẵn sàng lắng nghe qua số 0989836893."},{"id":618,"q":"Sợ vào phòng thi có phải yếu đuối không?","a":"Cô hiểu rằng điều này có thể khiến em mệt mỏi hoặc lo lắng. Không. Ai cũng có cảm xúc lo lắng. Em thử bắt đầu bằng một việc nhỏ, cụ thể hôm nay: chia nhiệm vụ thành từng phần, ưu tiên việc quan trọng nhất và dành thời gian nghỉ ngắn, ngủ đủ. Nếu vấn đề liên quan đến điểm số hay kỳ vọng của gia đình, em có thể nói với cha mẹ hoặc thầy cô về điều em đang gặp khó khăn và đề nghị cùng lập kế hoạch phù hợp. Em kể cô nghe điều gì đang làm em áp lực nhất nhé; cô Hường cũng sẵn sàng lắng nghe qua số 0989836893."},{"id":619,"q":"Áp lực có thể khiến quên bài không?","a":"Cô cảm ơn em đã đặt câu hỏi. Có. Stress cao làm giảm khả năng truy xuất trí nhớ. Em hãy thử áp dụng từng bước nhỏ, phù hợp với hoàn cảnh của mình; không cần phải giải quyết mọi việc ngay lập tức. Nếu đã cố gắng mà vẫn thấy khó khăn, em có thể tìm đến cha mẹ, giáo viên chủ nhiệm hoặc người lớn em tin tưởng để cùng tìm cách giải quyết. Em có thể chia sẻ thêm tình huống cụ thể để cô tư vấn sát với điều em đang gặp phải. Cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công, số 0989836893."},{"id":620,"q":"Điều quan trọng nhất khi đối diện áp lực là gì?","a":"Cô cảm ơn em đã đặt câu hỏi. Nhận diện cảm xúc và tìm cách điều chỉnh thay vì né tránh. Em hãy thử áp dụng từng bước nhỏ, phù hợp với hoàn cảnh của mình; không cần phải giải quyết mọi việc ngay lập tức. Nếu đã cố gắng mà vẫn thấy khó khăn, em có thể tìm đến cha mẹ, giáo viên chủ nhiệm hoặc người lớn em tin tưởng để cùng tìm cách giải quyết. Em có thể chia sẻ thêm tình huống cụ thể để cô tư vấn sát với điều em đang gặp phải. Cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công, số 0989836893."},{"id":621,"q":"Hít thở sâu có giúp giảm căng thẳng không?","a":"Cô cảm ơn em đã nói ra điều mình đang trải qua. Có. Thở chậm giúp hệ thần kinh thư giãn. Cảm xúc của em đáng được lắng nghe; em không cần tự trách mình vì đang buồn, lo lắng hay tức giận. Em có thể thử gọi tên cảm xúc, hít thở chậm, viết ra điều khiến mình khó chịu và chọn một người đáng tin để chia sẻ. Nếu tình trạng kéo dài, ảnh hưởng giấc ngủ, ăn uống, học tập hoặc khiến em thấy không an toàn, hãy báo cho người lớn và tìm hỗ trợ trực tiếp. Em muốn kể cô nghe chuyện gì thường xảy ra trước khi em có cảm giác này không? Cô Hường có thể lắng nghe qua số 0989836893."},{"id":622,"q":"Lập kế hoạch học tập có giúp giảm lo lắng không?","a":"Cô hiểu rằng điều này có thể khiến em mệt mỏi hoặc lo lắng. Có. Kế hoạch rõ ràng giúp bạn cảm thấy kiểm soát được tình hình. Em thử bắt đầu bằng một việc nhỏ, cụ thể hôm nay: chia nhiệm vụ thành từng phần, ưu tiên việc quan trọng nhất và dành thời gian nghỉ ngắn, ngủ đủ. Nếu vấn đề liên quan đến điểm số hay kỳ vọng của gia đình, em có thể nói với cha mẹ hoặc thầy cô về điều em đang gặp khó khăn và đề nghị cùng lập kế hoạch phù hợp. Em kể cô nghe điều gì đang làm em áp lực nhất nhé; cô Hường cũng sẵn sàng lắng nghe qua số 0989836893."},{"id":623,"q":"Chia nhỏ mục tiêu có lợi không?","a":"Cô cảm ơn em đã đặt câu hỏi. Có. Hoàn thành từng phần nhỏ tạo cảm giác thành công. Em hãy thử áp dụng từng bước nhỏ, phù hợp với hoàn cảnh của mình; không cần phải giải quyết mọi việc ngay lập tức. Nếu đã cố gắng mà vẫn thấy khó khăn, em có thể tìm đến cha mẹ, giáo viên chủ nhiệm hoặc người lớn em tin tưởng để cùng tìm cách giải quyết. Em có thể chia sẻ thêm tình huống cụ thể để cô tư vấn sát với điều em đang gặp phải. Cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công, số 0989836893."},{"id":624,"q":"Nghỉ giải lao khi học có cần thiết không?","a":"Cô hiểu rằng điều này có thể khiến em mệt mỏi hoặc lo lắng. Có. Não cần thời gian nghỉ để xử lý thông tin. Em thử bắt đầu bằng một việc nhỏ, cụ thể hôm nay: chia nhiệm vụ thành từng phần, ưu tiên việc quan trọng nhất và dành thời gian nghỉ ngắn, ngủ đủ. Nếu vấn đề liên quan đến điểm số hay kỳ vọng của gia đình, em có thể nói với cha mẹ hoặc thầy cô về điều em đang gặp khó khăn và đề nghị cùng lập kế hoạch phù hợp. Em kể cô nghe điều gì đang {"id":701,"q":"Vì sao con cái thường cãi lời cha mẹ ở tuổi THCS?","a":"Cô cảm ơn em đã đặt câu hỏi. Vì đây là giai đoạn muốn khẳng định bản thân và độc lập hơn. Sự khác biệt quan điểm dễ dẫn đến xung đột. Em hãy thử áp dụng từng bước nhỏ, phù hợp với hoàn cảnh của mình; không cần phải giải quyết mọi việc ngay lập tức. Nếu đã cố gắng mà vẫn thấy khó khăn, em có thể tìm đến cha mẹ, giáo viên chủ nhiệm hoặc người lớn em tin tưởng để cùng tìm cách giải quyết. Em có thể chia sẻ thêm tình huống cụ thể để cô tư vấn sát với điều em đang gặp phải. Cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công, số 0989836893."},{"id":702,"q":"Mâu thuẫn với cha mẹ có bình thường không?","a":"Cô cảm ơn em đã đặt câu hỏi. Có. Khác biệt thế hệ là điều tự nhiên, quan trọng là cách giải quyết. Em hãy thử áp dụng từng bước nhỏ, phù hợp với hoàn cảnh của mình; không cần phải giải quyết mọi việc ngay lập tức. Nếu đã cố gắng mà vẫn thấy khó khăn, em có thể tìm đến cha mẹ, giáo viên chủ nhiệm hoặc người lớn em tin tưởng để cùng tìm cách giải quyết. Em có thể chia sẻ thêm tình huống cụ thể để cô tư vấn sát với điều em đang gặp phải. Cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công, số 0989836893."},{"id":703,"q":"Vì sao cha mẹ hay nhắc nhở nhiều?","a":"Cô cảm ơn em đã đặt câu hỏi. Vì lo lắng và muốn con phát triển tốt. Tuy nhiên cách thể hiện đôi khi làm con khó chịu. Em hãy thử áp dụng từng bước nhỏ, phù hợp với hoàn cảnh của mình; không cần phải giải quyết mọi việc ngay lập tức. Nếu đã cố gắng mà vẫn thấy khó khăn, em có thể tìm đến cha mẹ, giáo viên chủ nhiệm hoặc người lớn em tin tưởng để cùng tìm cách giải quyết. Em có thể chia sẻ thêm tình huống cụ thể để cô tư vấn sát với điều em đang gặp phải. Cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công, số 0989836893."},{"id":704,"q":"Cảm thấy “bố mẹ không hiểu mình” có phổ biến không?","a":"Cô cảm ơn em đã đặt câu hỏi. Có. Do thiếu chia sẻ cảm xúc và góc nhìn khác nhau. Em hãy thử áp dụng từng bước nhỏ, phù hợp với hoàn cảnh của mình; không cần phải giải quyết mọi việc ngay lập tức. Nếu đã cố gắng mà vẫn thấy khó khăn, em có thể tìm đến cha mẹ, giáo viên chủ nhiệm hoặc người lớn em tin tưởng để cùng tìm cách giải quyết. Em có thể chia sẻ thêm tình huống cụ thể để cô tư vấn sát với điều em đang gặp phải. Cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công, số 0989836893."},{"id":705,"q":"Khi bị so sánh với “con nhà người ta”, nên làm gì?","a":"Cô cảm ơn em đã đặt câu hỏi. Bình tĩnh bày tỏ cảm xúc của mình thay vì phản ứng tiêu cực. Em hãy thử áp dụng từng bước nhỏ, phù hợp với hoàn cảnh của mình; không cần phải giải quyết mọi việc ngay lập tức. Nếu đã cố gắng mà vẫn thấy khó khăn, em có thể tìm đến cha mẹ, giáo viên chủ nhiệm hoặc người lớn em tin tưởng để cùng tìm cách giải quyết. Em có thể chia sẻ thêm tình huống cụ thể để cô tư vấn sát với điều em đang gặp phải. Cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công, số 0989836893."},{"id":706,"q":"Cha mẹ kiểm soát điện thoại có phải không tin con?","a":"Cô cảm ơn em đã đặt câu hỏi. Không hẳn. Thường là vì lo an toàn, nhưng cần trao đổi để thống nhất. Em hãy thử áp dụng từng bước nhỏ, phù hợp với hoàn cảnh của mình; không cần phải giải quyết mọi việc ngay lập tức. Nếu đã cố gắng mà vẫn thấy khó khăn, em có thể tìm đến cha mẹ, giáo viên chủ nhiệm hoặc người lớn em tin tưởng để cùng tìm cách giải quyết. Em có thể chia sẻ thêm tình huống cụ thể để cô tư vấn sát với điều em đang gặp phải. Cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công, số 0989836893."},{"id":707,"q":"La mắng có giúp con tiến bộ không?","a":"Cô cảm ơn em đã đặt câu hỏi. Thường không hiệu quả lâu dài. Lắng nghe và hướng dẫn tích cực sẽ tốt hơn. Em hãy thử áp dụng từng bước nhỏ, phù hợp với hoàn cảnh của mình; không cần phải giải quyết mọi việc ngay lập tức. Nếu đã cố gắng mà vẫn thấy khó khăn, em có thể tìm đến cha mẹ, giáo viên chủ nhiệm hoặc người lớn em tin tưởng để cùng tìm cách giải quyết. Em có thể chia sẻ thêm tình huống cụ thể để cô tư vấn sát với điều em đang gặp phải. Cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công, số 0989836893."},{"id":708,"q":"Im lặng khi giận cha mẹ có tốt không?","a":"Cô cảm ơn em đã nói ra điều mình đang trải qua. Không nên kéo dài. Giữ im lặng lâu khiến hiểu lầm sâu hơn. Cảm xúc của em đáng được lắng nghe; em không cần tự trách mình vì đang buồn, lo lắng hay tức giận. Em có thể thử gọi tên cảm xúc, hít thở chậm, viết ra điều khiến mình khó chịu và chọn một người đáng tin để chia sẻ. Nếu tình trạng kéo dài, ảnh hưởng giấc ngủ, ăn uống, học tập hoặc khiến em thấy không an toàn, hãy báo cho người lớn và tìm hỗ trợ trực tiếp. Em muốn kể cô nghe chuyện gì thường xảy ra trước khi em có cảm giác này không? Cô Hường có thể lắng nghe qua số 0989836893."},{"id":709,"q":"Cha mẹ áp đặt nghề nghiệp có ảnh hưởng gì?","a":"Cô cảm ơn em đã đặt câu hỏi. Có thể làm con mất động lực và cảm thấy không được tôn trọng. Em hãy thử áp dụng từng bước nhỏ, phù hợp với hoàn cảnh của mình; không cần phải giải quyết mọi việc ngay lập tức. Nếu đã cố gắng mà vẫn thấy khó khăn, em có thể tìm đến cha mẹ, giáo viên chủ nhiệm hoặc người lớn em tin tưởng để cùng tìm cách giải quyết. Em có thể chia sẻ thêm tình huống cụ thể để cô tư vấn sát với điều em đang gặp phải. Cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công, số 0989836893."},{"id":710,"q":"Cãi vã trước mặt người khác có nên không?","a":"Cô cảm ơn em đã đặt câu hỏi. Không. Điều đó làm tổn thương và giảm sự tôn trọng lẫn nhau. Em hãy thử áp dụng từng bước nhỏ, phù hợp với hoàn cảnh của mình; không cần phải giải quyết mọi việc ngay lập tức. Nếu đã cố gắng mà vẫn thấy khó khăn, em có thể tìm đến cha mẹ, giáo viên chủ nhiệm hoặc người lớn em tin tưởng để cùng tìm cách giải quyết. Em có thể chia sẻ thêm tình huống cụ thể để cô tư vấn sát với điều em đang gặp phải. Cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công, số 0989836893."},{"id":711,"q":"Vì sao cha mẹ hay lo điểm số?","a":"Cô hiểu rằng điều này có thể khiến em mệt mỏi hoặc lo lắng. Vì nghĩ học tập quyết định tương lai. Tuy nhiên cần cân bằng với sức khỏe tinh thần. Em thử bắt đầu bằng một việc nhỏ, cụ thể hôm nay: chia nhiệm vụ thành từng phần, ưu tiên việc quan trọng nhất và dành thời gian nghỉ ngắn, ngủ đủ. Nếu vấn đề liên quan đến điểm số hay kỳ vọng của gia đình, em có thể nói với cha mẹ hoặc thầy cô về điều em đang gặp khó khăn và đề nghị cùng lập kế hoạch phù hợp. Em kể cô nghe điều gì đang làm em áp lực nhất nhé; cô Hường cũng sẵn sàng lắng nghe qua số 0989836893."},{"id":712,"q":"Khác biệt thế hệ ảnh hưởng thế nào?","a":"Cô cảm ơn em đã đặt câu hỏi. Mỗi thế hệ có cách suy nghĩ khác, cần học cách thấu hiểu. Em hãy thử áp dụng từng bước nhỏ, phù hợp với hoàn cảnh của mình; không cần phải giải quyết mọi việc ngay lập tức. Nếu đã cố gắng mà vẫn thấy khó khăn, em có thể tìm đến cha mẹ, giáo viên chủ nhiệm hoặc người lớn em tin tưởng để cùng tìm cách giải quyết. Em có thể chia sẻ thêm tình huống cụ thể để cô tư vấn sát với điều em đang gặp phải. Cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công, số 0989836893."},{"id":713,"q":"Khi cha mẹ không cho đi chơi, nên làm gì?","a":"Cô cảm ơn em đã đặt câu hỏi. Hỏi rõ lý do và thương lượng thay vì phản ứng gay gắt. Em hãy thử áp dụng từng bước nhỏ, phù hợp với hoàn cảnh của mình; không cần phải giải quyết mọi việc ngay lập tức. Nếu đã cố gắng mà vẫn thấy khó khăn, em có thể tìm đến cha mẹ, giáo viên chủ nhiệm hoặc người lớn em tin tưởng để cùng tìm cách giải quyết. Em có thể chia sẻ thêm tình huống cụ thể để cô tư vấn sát với điều em đang gặp phải. Cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công, số 0989836893."},{"id":714,"q":"Nói dối để tránh bị mắng có nên không?","a":"Cô cảm ơn em đã đặt câu hỏi. Không. Nói dối làm mất niềm tin lâu dài. Em hãy thử áp dụng từng bước nhỏ, phù hợp với hoàn cảnh của mình; không cần phải giải quyết mọi việc ngay lập tức. Nếu đã cố gắng mà vẫn thấy khó khăn, em có thể tìm đến cha mẹ, giáo viên chủ nhiệm hoặc người lớn em tin tưởng để cùng tìm cách gi Cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công, số 0989836893."},{"id":935,"q":"Dành thời gian cho bạn bè có giúp giảm buồn không?","a":"Cô nghe được rằng chuyện này có thể làm em buồn hoặc khó xử. Có. Kết nối xã hội giúp tăng cảm giác được hỗ trợ. Nếu cảm thấy an toàn, em hãy chọn lúc cả hai bình tĩnh để nói bằng câu bắt đầu từ cảm xúc của mình, chẳng hạn: “Mình buồn khi… và mong…”. Hãy lắng nghe phía bạn nhưng cũng giữ ranh giới; em không cần chấp nhận việc xúc phạm, ép buộc hay làm tổn thương mình chỉ để giữ tình bạn. Em có thể chia sẻ thêm chuyện đã xảy ra như thế nào không? Cô Hường sẵn sàng lắng nghe em qua số 0989836893."},{"id":936,"q":"Nghỉ ngơi khi quá tải có nên không?","a":"Cô cảm ơn em đã đặt câu hỏi. Nên. Nghỉ đúng lúc giúp tránh kiệt sức. Em hãy thử áp dụng từng bước nhỏ, phù hợp với hoàn cảnh của mình; không cần phải giải quyết mọi việc ngay lập tức. Nếu đã cố gắng mà vẫn thấy khó khăn, em có thể tìm đến cha mẹ, giáo viên chủ nhiệm hoặc người lớn em tin tưởng để cùng tìm cách giải quyết. Em có thể chia sẻ thêm tình huống cụ thể để cô tư vấn sát với điều em đang gặp phải. Cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công, số 0989836893."},{"id":937,"q":"Chia nhỏ vấn đề có giúp bớt lo không?","a":"Cô cảm ơn em đã đặt câu hỏi. Có. Vấn đề nhỏ dễ giải quyết hơn. Em hãy thử áp dụng từng bước nhỏ, phù hợp với hoàn cảnh của mình; không cần phải giải quyết mọi việc ngay lập tức. Nếu đã cố gắng mà vẫn thấy khó khăn, em có thể tìm đến cha mẹ, giáo viên chủ nhiệm hoặc người lớn em tin tưởng để cùng tìm cách giải quyết. Em có thể chia sẻ thêm tình huống cụ thể để cô tư vấn sát với điều em đang gặp phải. Cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công, số 0989836893."},{"id":938,"q":"Học cách nói “không” có giúp bảo vệ tinh thần không?","a":"Cô hiểu rằng điều này có thể khiến em mệt mỏi hoặc lo lắng. Có. Biết từ chối giúp tránh quá tải. Em thử bắt đầu bằng một việc nhỏ, cụ thể hôm nay: chia nhiệm vụ thành từng phần, ưu tiên việc quan t iám hiệu; giữ lại tin nhắn/hình ảnh làm bằng chứng nếu an toàn, không tự đối đầu hay trả đũa. Em có thể liên hệ cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công qua số 0989836893 để được hỗ trợ trực tiếp. Nếu có nguy cơ tức thời, hãy nhờ người lớn gọi cơ quan chức năng/cấp cứu phù hợp ngay."},{"id":956,"q":"Nhờ giúp đỡ có phải yếu đuối không?","a":"Cô cảm ơn em đã đặt câu hỏi. Không. Biết tìm hỗ trợ là trưởng thành. Em hãy thử áp dụng từng bước nhỏ, phù hợp với hoàn cảnh của mình; không cần phải giải quyết mọi việc ngay lập tức. Nếu đã cố gắng mà vẫn thấy khó khăn, em có thể tìm đến cha mẹ, giáo viên chủ nhiệm hoặc người lớn em tin tưởng để cùng tìm cách giải quyết. Em có thể chia sẻ thêm tình huống cụ thể để cô tư vấn sát với điều em đang gặp phải. Cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công, số 0989836893."},{"id":957,"q":"Tổng đài hỗ trợ tâm lý có đáng tin không?","a":"Cô cảm ơn em đã đặt câu hỏi. Có. Đây là kênh hỗ trợ khẩn cấp khi cần. Em hãy thử áp dụng từng bước nhỏ, phù hợp với hoàn cảnh của mình; không cần phải giải quyết mọi việc ngay lập tức. Nếu đã cố gắng mà vẫn thấy khó khăn, em có thể tìm đến cha mẹ, giáo viên chủ nhiệm hoặc người lớn em tin tưởng để cùng tìm cách giải quyết. Em có thể chia sẻ thêm tình huống cụ thể để cô tư vấn sát với điều em đang gặp phải. Cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công, số 0989836893."},{"id":958,"q":"Có nên tìm thông tin trên mạng khi buồn?","a":"Cô cảm ơn em đã nói ra điều mình đang trải qua. Có thể, nhưng cần chọn nguồn chính thống. Cảm xúc của em đáng được lắng nghe; em không cần tự trách mình vì đang buồn, lo lắng hay tức giận. Em có thể thử gọi tên cảm xúc, hít thở chậm, viết ra điều khiến mình khó chịu và chọn một người đáng tin để chia sẻ. Nếu tình trạng kéo dài, ảnh hưởng giấc ngủ, ăn uống, học tập hoặc khiến em thấy không an toàn, hãy báo cho người lớn và tìm hỗ trợ trực tiếp. Em muốn kể cô nghe chuyện gì thường xảy ra trước khi em có cảm giác này không? Cô Hường có thể lắng nghe qua số 0989836893."},{"id":959,"q":"Khi bạn có dấu hiệu bất ổn, nên làm gì?","a":"Cô nghe được rằng chuyện này có thể làm em buồn hoặc khó xử. Nhẹ nhàng hỏi thăm và khuyến khích bạn tìm hỗ trợ. Nếu cảm thấy an toàn, em hãy chọn lúc cả hai bình tĩnh để nói bằng câu bắt đầu từ cảm xúc của mình, chẳng hạn: “Mình buồn khi… và mong…”. Hãy lắng nghe phía bạn nhưng cũng giữ ranh giới; em không cần chấp nhận việc xúc phạm, ép buộc hay làm tổn thương mình chỉ để giữ tình bạn. Em có thể chia sẻ thêm chuyện đã xảy ra như thế nào không? Cô Hường sẵn sàng lắng nghe em qua số 0989836893."},{"id":960,"q":"Tư vấn tâm lý có giúp giải quyết mọi vấn đề ngay không?","a":"Cô cảm ơn em đã đặt câu hỏi. Không ngay lập tức, nhưng giúp tìm hướng đi đúng. Em hãy thử áp dụng từng bước nhỏ, phù hợp với hoàn cảnh của mình; không cần phải giải quyết mọi việc ngay lập tức. Nếu đã cố gắng mà vẫn thấy khó khăn, em có thể tìm đến cha mẹ, giáo viên chủ nhiệm hoặc người lớn em tin tưởng để cùng tìm cách giải quyết. Em có thể chia sẻ thêm tình huống cụ thể để cô tư vấn sát với điều em đang gặp phải. Cô Hường – Giáo viên tư vấn tâm lý Trường THCS Phụng Công, số 0989836893."},{"id":981,"q":"Lớp học hạnh phúc là gì?","a":"Cô hiểu rằng điều này có thể khiến em mệt mỏi hoặc lo lắng. Là nơi học sinh cảm thấy an toàn và được tôn trọng. Em thử bắt đầu bằng một việc nhỏ, cụ thể hôm nay: chia nhiệm vụ thành từng phần, ưu tiên việc quan trọng nhất và dành thời gian nghỉ ngắn, ngủ đủ. Nếu vấn đề liên quan đến điểm số hay kỳ vọng của gia đình, em có thể nói với cha mẹ hoặc thầy cô về điều em đang gặp khó khăn và đề nghị cùng lập kế hoạch phù hợp. Em kể cô nghe điều gì đang làm em áp lực nhất nhé; cô Hường cũng sẵn sàng lắng nghe qua số 0989836893."},{"id":982,"q":"Tôn trọng cảm xúc người khác có quan trọng không?","a":"Cô cảm ơn em đã đặt câu hỏi. Rất quan trọng. Sự tôn trọng giúp giảm tổn thương. Em hãy thử áp dụng từng bước nhỏ, phù hợp với hoàn cảnh của mình; không cần phải giải quyết mọi việc ngay lập t   function normalize(s){
    return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d");
  }

  function escapeHtml(s){
    const d=document.createElement("div"); d.textContent=s; return d.innerHTML;
  }

  function scrollBottom(){
    requestAnimationFrame(()=>{messages.scrollTop=messages.scrollHeight});
  }

  function addMessage(text,type){
    const el=document.createElement("div");
    el.className="message "+(type==="user"?"user-message":"bot-message");
    if(type==="bot"){
      el.innerHTML='<div class="bot-avatar">👩‍⚕️</div><div class="message-content">'+text+'</div>';
    }else{
      el.innerHTML='<div class="message-content">'+escapeHtml(text)+'</div>';
    }
    messages.appendChild(el);
    scrollBottom();
  }

  function showTyping(){
    const el=document.createElement("div");
    el.className="message bot-message";
    el.id="typingMessage";
    el.innerHTML='<div class="bot-avatar">👩‍⚕️</div><div class="message-content typing"><i></i><i></i><i></i></div>';
    messages.appendChild(el); scrollBottom();
  }

  function getWords(text){
    const stop = new Set([
      "em","co","cô","toi","tôi","minh","mình","la","là","gi","gì","the","thế","nao","nào","sao","a","ạ","cho","mot","một","nhu","như","co","cô","voi","với","va","và","hay","co","có","khong","không","bi","bị","dang","đang","rat","rất","lam","làm","de","để","khi","vi","vì","thi","thì","se","sẽ","can","cần","nen","nên","phai","phải","duoc","được"
    ]);
    return normalize(text)
      .split(/[^a-z0-9]+/)
      .filter(w => w.length >= 2 && !stop.has(w));
  }

  function answer(text){
    const q = normalize(text);
    const queryWords = getWords(text);

    if(!queryWords.length){
      return "Cô Hường đang lắng nghe em 💜 Em hãy kể cho cô điều em đang suy nghĩ hoặc điều khiến em lo lắng nhé.";
    }

    let best = null;
    let bestScore = 0;

    for(const item of knowledge){
      const words = getWords(item.q);
      if(!words.length) continue;

      let score = 0;
      const unique = new Set(words);

      for(const w of queryWords){
        if(unique.has(w)) score += 1;
      }

      // Thưởng cho cụm từ giống nhau, giúp nhận diện câu hỏi gần giống mẫu.
      const phrase = queryWords.slice(0, 5).join(" ");
      if(phrase && normalize(item.q).includes(phrase)) score += 2;

      // Ưu tiên câu trả lời có nhiều từ khóa trùng khớp.
      const ratio = score / Math.max(2, queryWords.length);
      const finalScore = score + ratio * 2;

      if(finalScore > bestScore){
        bestScore = finalScore;
        best = item;
      }
    }

    // Chỉ dùng kiến thức khi có mức độ khớp đủ tốt, tránh trả lời ngẫu nhiên.
    if(best && (bestScore >= 2.2 || (queryWords.length <= 3 && bestScore >= 1.5))){
      return escapeHtml(best.a);
    }

    return `<p>Cô Hường đang lắng nghe em 💜</p>
            <p>Cô chưa tìm thấy câu trả lời thật sát với điều em vừa hỏi.</p>
            <p>Em có thể nói cụ thể hơn về <b>cảm xúc, học tập, áp lực thi cử, bạn bè, bạo lực học đường, gia đình, tuổi dậy thì, sự tự tin hoặc sức khỏe tinh thần</b>. Cô sẽ cố gắng giúp em dựa trên những kiến thức đã được bổ sung.</p>`;
  }

  // Thông tin giáo viên tư vấn được giới thiệu ở câu trả lời đầu tiên
  // sau khi học sinh bắt đầu trao đổi.
  const counselorInfo = `
    <div class="counselor-info">
      <div><b>👩‍🏫 Cô Hường - Giáo viên tư vấn tâm lý học đường</b></div>
      <div>🏫 Trường THCS Phụng Công</div>
      <div>📞 <a href="tel:0989836893">0989836893</a></div>
      <div>✉️ <a href="mailto:nguyenthuhuong7993@gmail.com">nguyenthuhuong7993@gmail.com</a></div>
      <div>🕐 Thời gian tư vấn: <b>7:00 - 22:00</b></div>
    </div>`;

  let firstCounselingReply = true;

  function sendMessage(){
    const text=input.value.trim();
    if(!text) return;
    addMessage(text,"user");
    input.value="";
    send.disabled=true;
    showTyping();
    setTimeout(()=>{
      document.getElementById("typingMessage")?.remove();

      let reply = answer(text);

      // Chỉ chèn thông tin liên hệ vào phần trả lời đầu tiên của chatbot.
      if(firstCounselingReply){
        reply = counselorInfo + reply;
        firstCounselingReply = false;
      }

      addMessage(reply,"bot");
      send.disabled=false;
      input.focus();
    },650);
  }

  send.addEventListener("click",sendMessage);
  input.addEventListener("keydown",e=>{
    if(e.key==="Enter"){e.preventDefault();sendMessage();}
  });

  document.querySelectorAll(".reply-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      input.value=btn.dataset.message;
      sendMessage();
    });
  });
});
</script>
