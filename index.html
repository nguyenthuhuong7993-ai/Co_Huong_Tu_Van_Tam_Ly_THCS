<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cô Hường - Tư vấn Tâm lý Học đường</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{background:#eeeef3;overflow:hidden}

.chat-container{
  width:100%;max-width:600px;height:100dvh;margin:auto;background:#fff;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 0 30px rgba(50,40,100,.12)
}

/* Header */
.chat-header{
  flex:0 0 auto;min-height:156px;padding:24px 16px 20px;
  display:flex;align-items:center;gap:13px;color:#fff;
  background:linear-gradient(135deg,#5141e8 0%,#713be9 52%,#8b35e8 100%);
}
.avatar{
  width:60px;height:60px;min-width:60px;border-radius:50%;
  background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.28);
  display:flex;align-items:center;justify-content:center;font-size:29px;
}
.header-info{flex:1;min-width:0}
.header-info h1{font-size:25px;line-height:1.1;margin-bottom:7px;font-weight:750}
.header-info p{font-size:16px;line-height:1.35;max-width:285px}
.status{display:flex;align-items:center;gap:7px;font-size:15px;flex:0 0 auto}
.dot{width:11px;height:11px;border-radius:50%;background:#58ff70;box-shadow:0 0 10px #58ff70}

/* Messages */
.chat-messages{
  flex:1;min-height:0;overflow-y:auto;padding:38px 13px 18px;
  background:linear-gradient(#fff,#fafafa);scroll-behavior:smooth;
}
.message{display:flex;width:100%;margin-bottom:19px;animation:appear .2s ease}
@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.bot-message{justify-content:flex-start;align-items:flex-start}
.user-message{justify-content:flex-end;align-items:flex-start}
.bot-avatar{
  width:43px;height:43px;min-width:43px;margin-right:10px;border-radius:50%;
  background:#eef0ff;color:#5147dd;display:flex;align-items:center;justify-content:center;font-size:21px
}
.message-content{
  max-width:78%;padding:13px 17px;font-size:18px;line-height:1.55;
  overflow-wrap:anywhere
}
.bot-message .message-content{
  background:#fff;color:#262626;border:1px solid #e2e2e2;
  border-radius:5px 22px 22px 22px;box-shadow:0 2px 7px rgba(0,0,0,.04)
}
.user-message .message-content{
  background:linear-gradient(135deg,#6548ed,#813de7);color:#fff;
  border-radius:22px 5px 22px 22px;box-shadow:0 3px 10px rgba(100,70,220,.2)
}
.message-content p{margin-bottom:9px}
.message-content p:last-child{margin-bottom:0}

/* Suggestions */
.quick-replies{
  flex:0 0 auto;padding:13px 18px 9px;background:#fff;border-top:1px solid #eee;
  display:flex;flex-direction:column;align-items:flex-start;gap:9px
}
.reply-btn{
  border:1px solid #ddd;border-radius:26px;background:linear-gradient(#fff,#f7f7f7);
  padding:10px 17px;min-height:47px;color:#303030;font-size:16px;cursor:pointer;
  box-shadow:0 1px 3px rgba(0,0,0,.04)
}
.reply-btn:active{transform:scale(.97)}
.reply-btn .ico{margin-right:7px}

/* Input */
.input-area{
  flex:0 0 auto;display:flex;gap:9px;padding:9px 14px;
  background:#fff;border-top:1px solid #eee;padding-bottom:max(9px,env(safe-area-inset-bottom))
}
#messageInput{
  flex:1;min-width:0;height:48px;border:1px solid #ddd;border-radius:25px;
  outline:none;padding:0 17px;font-size:16px;color:#333;background:#fff
}
#messageInput:focus{border-color:#7254ed;box-shadow:0 0 0 3px rgba(114,84,237,.09)}
.send-btn{
  width:48px;height:48px;min-width:48px;border:0;border-radius:50%;
  background:linear-gradient(135deg,#6249ed,#833ee8);color:#fff;font-size:20px;cursor:pointer
}
.send-btn:active{transform:scale(.94)}
.send-btn:disabled{opacity:.55}

/* Footer */
.footer-note{text-align:center;background:#fff;color:#999;font-size:11px;padding:4px 10px 7px}
.heart{color:#e86b99}

/* Typing */
.typing{display:flex;gap:5px;align-items:center;min-height:40px}
.typing i{display:block;width:7px;height:7px;background:#999;border-radius:50%;animation:bounce 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}


.counselor-info{
  margin-bottom:12px;padding:12px 13px;border-radius:14px;
  background:linear-gradient(135deg,#f3f1ff,#faf8ff);
  border:1px solid #ddd6ff;color:#34305a;font-size:15px;line-height:1.55;
}
.counselor-info div{margin:2px 0}
.counselor-info a{color:#5d45d9;text-decoration:none;font-weight:600}
.counselor-info a:hover{text-decoration:underline}

@media(max-width:600px){
  .chat-container{max-width:none}
  .chat-header{min-height:156px;padding:20px 13px}
  .avatar{width:58px;height:58px;min-width:58px}
  .header-info h1{font-size:24px}
  .header-info p{font-size:16px}
  .status{font-size:14px;max-width:62px}
  .message-content{font-size:18px;max-width:79%}
}
@media(max-width:380px){
  .header-info h1{font-size:21px}.header-info p{font-size:14px}
  .status{font-size:12px}.message-content{font-size:16px}
  .reply-btn{font-size:14px}
}
</style>
</head>

<body>
<div class="chat-container">

  <header class="chat-header">
    <div class="avatar">👩‍⚕️</div>
    <div class="header-info">
      <h1>Cô Hường</h1>
      <p>Giáo viên Tư vấn Tâm lý Học đường</p>
    </div>
    <div class="status"><span class="dot"></span><span>Trực<br>tuyến</span></div>
  </header>

  <main class="chat-messages" id="chatMessages">
    <div class="message bot-message">
      <div class="bot-avatar">👩‍⚕️</div>
      <div class="message-content">
        <p>Chào em! 👋 Cô Hường rất vui được trò chuyện cùng em!</p>
        <p>Nếu em có bất kỳ khó khăn, lo lắng nào trong học tập, bạn bè, gia đình hay cảm xúc, hãy chia sẻ với cô nhé 💜</p>
      </div>
    </div>
  </main>

  <div class="quick-replies">
    <button class="reply-btn" data-message="Em muốn được tư vấn"><span class="ico">💡</span>Tôi muốn được tư vấn</button>
    <button class="reply-btn" data-message="Em đang gặp khó khăn"><span class="ico">🤲</span>Tôi đang gặp khó khăn</button>
    <button class="reply-btn" data-message="Em muốn tâm sự"><span class="ico">♥</span>Tôi muốn tâm sự</button>
  </div>

  <div class="input-area">
    <input id="messageInput" type="text" placeholder="Nhập câu hỏi của em..." autocomplete="off">
    <button class="send-btn" id="sendBtn" aria-label="Gửi">➤</button>
  </div>

  <div class="footer-note"><span class="heart">♥</span> Cô Hường • Luôn lắng nghe và đồng hành cùng em</div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const messages = document.getElementById("chatMessages");
  const input = document.getElementById("messageInput");
  const send = document.getElementById("sendBtn");

  const knowledge = [{"id":0,"q":"chào xin chào hello hi","a":"Chào em! 👋 Cô Hường rất vui được trò chuyện cùng em. Em muốn chia sẻ điều gì với cô hôm nay?"},{"id":0,"q":"em muốn được tư vấn em muốn tâm sự em đang gặp khó khăn","a":"Được chứ em. 💜 Cô Hường đang lắng nghe em đây. Em cứ chia sẻ điều khiến em lo lắng hoặc khó khăn, cô sẽ cùng em tìm cách tháo gỡ từng bước."},{"id":0,"q":"cảm ơn cô cảm ơn","a":"Không có gì đâu em. 🌷 Khi cần chia sẻ, em có thể tiếp tục trò chuyện cùng cô."},{"id":1,"q":"Em hay buồn vô cớ là sao ạ?","a":"Có thể do căng thẳng hoặc thay đổi tuổi dậy thì."},{"id":2,"q":"Tại sao em dễ cáu gắt?","a":"Khi mệt mỏi hoặc áp lực, cảm xúc tiêu cực dễ xuất hiện."},{"id":3,"q":"Em không hiểu mình đang cảm thấy gì?","a":"Hãy thử viết ra điều đang xảy ra và suy nghĩ của em."},{"id":4,"q":"Buồn và trầm cảm khác nhau thế nào?","a":"Buồn là tạm thời; trầm cảm kéo dài và ảnh hưởng sinh hoạt."},{"id":5,"q":"Em thấy mình vô dụng?","a":"Đó là suy nghĩ tiêu cực, không phải sự thật về em."},{"id":6,"q":"Em hay lo lắng quá mức?","a":"Lo lắng nhiều thường do thiếu cảm giác an toàn."},{"id":7,"q":"Làm sao biết mình đang stress?","a":"Mất ngủ, đau đầu, khó tập trung."},{"id":8,"q":"Em hay khóc có yếu đuối không?","a":"Không, khóc là cách giải tỏa cảm xúc."},{"id":9,"q":"Em thấy cô đơn dù có bạn?","a":"Có thể em chưa chia sẻ cảm xúc thật của mình."},{"id":10,"q":"Vì sao em hay suy nghĩ tiêu cực?","a":"Khi áp lực cao, não dễ tập trung vào điều xấu. ---"},{"id":11,"q":"Làm sao để bớt giận?","a":"Hít sâu 5 lần và tạm rời khỏi tình huống."},{"id":12,"q":"Em nóng tính quá thì sao?","a":"Luyện thói quen dừng lại trước khi phản ứng."},{"id":13,"q":"Làm sao bình tĩnh khi bị chê?","a":"Nhắc mình rằng lời chê không quyết định giá trị của em."},{"id":14,"q":"Em tức mà không nói được?","a":"Viết ra giấy trước khi nói chuyện."},{"id":15,"q":"Cách xử lý khi bị hiểu lầm?","a":"Giải thích nhẹ nhàng, không phản ứng gay gắt."},{"id":16,"q":"Làm sao để vui lên nhanh?","a":"Vận động nhẹ hoặc nghe nhạc yêu thích."},{"id":17,"q":"Em hay tự trách bản thân?","a":"Hãy tự hỏi: “Nếu là bạn mình, mình có trách vậy không?”"},{"id":18,"q":"Em khó kiểm soát lời nói lúc giận?","a":"Tập đếm 1–10 trước khi nói."},{"id":19,"q":"Em dễ bị ảnh hưởng bởi lời người khác?","a":"Hãy xác định giá trị bản thân không phụ thuộc lời nói đó."},{"id":20,"q":"Khi quá buồn nên làm gì?","a":"Tìm người tin tưởng để chia sẻ. ---"},{"id":21,"q":"Em thấy mình kém hơn bạn?","a":"Mỗi người có điểm mạnh khác nhau."},{"id":22,"q":"Em tự ti vì ngoại hình?","a":"Giá trị của em không chỉ nằm ở ngoại hình."},{"id":23,"q":"Làm sao để tự tin hơn?","a":"Tập trung vào điều em làm tốt."},{"id":24,"q":"Em sợ phát biểu trước lớp?","a":"Tập nói trước gương hoặc nhóm nhỏ trước."},{"id":25,"q":"Em ngại giao tiếp?","a":"Bắt đầu bằng chào hỏi đơn giản."},{"id":26,"q":"Em hay so sánh bản thân?","a":"So sánh chỉ nên để học hỏi, không để tự ti."},{"id":27,"q":"Em sợ bị đánh giá?","a":"Không ai được tất cả mọi người thích."},{"id":28,"q":"Em thấy mình không có tài năng?","a":"Tài năng cần được khám phá và rèn luyện."},{"id":29,"q":"Làm sao để yêu bản thân?","a":"Ghi nhận những điều tốt mình làm mỗi ngày."},{"id":30,"q":"Em thiếu động lực?","a":"Hãy đặt mục tiêu nhỏ, dễ đạt. ---"},{"id":31,"q":"Em hay suy nghĩ quá nhiều?","a":"Tập trung vào việc có thể kiểm soát."},{"id":32,"q":"Em bị ám ảnh lỗi sai?","a":"Sai lầm là cơ hội học hỏi."},{"id":33,"q":"Em sợ thất bại?","a":"Thất bại không định nghĩa con người em."},{"id":34,"q":"Em thấy mình không ai hiểu?","a":"Hãy thử chia sẻ rõ cảm xúc của mình."},{"id":35,"q":"Em dễ tổn thương?","a":"Nhạy cảm không xấu, chỉ cần học cách bảo vệ mình."},{"id":36,"q":"Em giận nhưng lại cười?","a":"Đó là kìm nén cảm xúc, lâu dài không tốt."},{"id":37,"q":"Em hay buồn ban đêm?","a":"Ban đêm dễ suy nghĩ nhiều, hãy ngủ đúng giờ."},{"id":38,"q":"Em thấy áp lực vô hình?","a":"Có thể do kỳ vọng bản thân quá cao."},{"id":39,"q":"Em hay ghen tị?","a":"Hãy biến ghen tị thành động lực ph ạo lực không?","a":"Có, đó là bạo lực tinh thần."},{"id":507,"q":"Vì sao học sinh thường ngại nói mình bị bắt nạt?","a":"Sợ bị trả thù, xấu hổ, sợ không ai tin."},{"id":508,"q":"Dấu hiệu học sinh đang bị bắt nạt là gì?","a":"Buồn bã, sợ đến trường, học giảm sút, hay lo lắng."},{"id":509,"q":"Người bắt nạt thường có đặc điểm gì?","a":"Muốn thể hiện quyền lực, thiếu kỹ năng kiểm soát cảm xúc."},{"id":510,"q":"Xem và cổ vũ đánh nhau có sai không?","a":"Có, đó là tiếp tay cho bạo lực."},{"id":511,"q":"Trêu đùa quá mức có thể thành bắt nạt không?","a":"Có, nếu gây tổn thương và lặp lại nhiều lần."},{"id":512,"q":"Bắt nạt ảnh hưởng lâu dài như thế nào?","a":"Gây tự ti, trầm cảm, sợ giao tiếp."},{"id":513,"q":"Bị bắt nạt có phải do yếu đuối không?","a":"Không, đó là hành vi sai của người bắt nạt."},{"id":514,"q":"Tại sao cần ngăn chặn bạo lực học đường?","a":"Để đảm bảo môi trường học tập an toàn."},{"id":515,"q":"Bạo lực học đường có vi phạm pháp luật không?","a":"Có thể, tùy mức độ."},{"id":516,"q":"Học sinh có thể báo ai khi bị bắt nạt?","a":"Giáo viên, phụ huynh, cán bộ tư vấn."},{"id":517,"q":"Giữ im lặng có giúp hết bị bắt nạt không?","a":"Không, cần tìm sự hỗ trợ."},{"id":518,"q":"Bắt nạt có thể xảy ra với ai?","a":"Với bất kỳ học sinh nào."},{"id":519,"q":"Có nên trả thù khi bị bắt nạt?","a":"Không, dễ làm tình hình nghiêm trọng hơn."},{"id":520,"q":"Điều quan trọng nhất khi bị bắt nạt là gì?","a":"Tìm người lớn đáng tin cậy để chia sẻ. ---"},{"id":521,"q":"Khi bị xúc phạm nên làm gì?","a":"Giữ bình tĩnh và rời khỏi tình huống."},{"id":522,"q":"Có nên đáp trả bằng lời lẽ nặng nề?","a":"Không, dễ leo thang mâu thuẫn."},{"id":523,"q":"Cách nói khi muốn người khác dừng lại?","a":"“Tớ không thích điều đó, bạn dừng lại nhé.”"},{"id":524,"q":"Nên ghi nhớ điều gì khi bị bắt nạt?","a":"Mình không có lỗi."},{"id":525,"q":"Có nên lưu lại bằng chứng bắt nạt trên mạng?","a":"Có, để báo người lớn."},{"id":526,"q":"Khi bị đe dọa nên làm gì?","a":"Báo ngay cho người lớn."},{"id":527,"q":"Có nên đi một mình nếu đang bị đe dọa?","a":"Không, nên đi cùng bạn."},{"id":528,"q":"Tự bảo vệ bản thân gồm những gì?","a":"Giữ an toàn, tìm hỗ trợ, không đối đầu trực tiếp."},{"id":529,"q":"Tập võ có giúp tránh bị bắt nạt không?","a":"Giúp tự tin nhưng không nên dùng để đánh trả."},{"id":530,"q":"Khi bạn thân bị bắt nạt, nên làm gì?","a":"Khuyên bạn tìm sự giúp đỡ."},{"id":531,"q":"Nếu sợ nói trực tiếp với giáo viên thì sao?","a":"Có thể viết thư hoặc nhắn tin."},{"id":532,"q":"Có nên chia sẻ với cha mẹ?","a":"Có, cha mẹ luôn là chỗ dựa."},{"id":533,"q":"Làm gì để tăng sự tự tin?","a":"Tham gia hoạt động, rèn kỹ năng giao tiếp."},{"id":534,"q":"Viết nhật ký có giúp ích không?","a":"Có, giúp giải tỏa cảm xúc."},{"id":535,"q":"Tìm đến phòng tư vấn có xấu hổ không?","a":"Không, đó là hành động tích cực."},{"id":536,"q":"Tự trách mình có nên không?","a":"Không, lỗi thuộc về người bắt nạt."},{"id":537,"q":"Có nên thay đổi bản thân để tránh bị bắt nạt?","a":"Không cần thay đổi giá trị bản thân."},{"id":538,"q":"Thở sâu có giúp bình tĩnh không?","a":"Có, giúp kiểm soát cảm xúc."},{"id":539,"q":"Khi bị lan truyền tin xấu nên làm gì?","a":"Báo giáo viên và lưu bằng chứng."},{"id":540,"q":"Có nên nghỉ học vì bị bắt nạt?","a":"Không nên, cần tìm giải pháp thay vì né tránh."},{"id":541,"q":"Cách giữ khoảng cách an toàn?","a":"Tránh ở nơi vắng vẻ với người đó."},{"id":542,"q":"Có nên nói rõ cảm xúc của mình?","a":"Có, để người khác hiểu bạn bị tổn thương."},{"id":543,"q":"Tập luyện thể thao có giúp không?","a":"Có, giúp giảm stress."},{"id":544,"q":"Nếu bị dọa đánh sau giờ học?","a":"Báo giáo viên ngay."},{"id":545,"q":"Giữ bí mật một mình có tốt không?","a":"Không, cần chia sẻ."},{"id":546,"q":"Cách xây dựng mạng lưới bạn bè an toàn?","a":"Tham gia nhóm tích cực."},{"id":547,"q":"Có nên block người bắt nạt trên mạng?","a":"Có, để bảo vệ mình."},{"id":548,"q":"Khi thấy lo sợ kéo dài nên làm gì?","a":"Gặp chuyên viên tư vấn."},{"id":549,"q":"Có nên tin lời đe dọa vô căn cứ?","a":"Không, cần xác minh và báo người lớn."},{"id":550,"q":"Điều quan trọng nhất là gì?","a":"Bạn xứng đáng được an toàn. ---"},{"id":551,"q":"Làm sao xây dựng lớp học an toàn?","a":"Tôn trọng và lắng nghe nhau."},{"id":552,"q":"Giáo viên có vai trò gì?","a":"Phát hiện sớm và can thiệp kịp thời."},{"id":553,"q":"Học sinh có trách nhiệm gì?","a":"Không cổ vũ bạo lực."},{"id":554,"q":"Nội quy lớp có giúp không?","a":"Có, tạo chuẩn mực hành vi."},{"id":555,"q":"Hoạt động tập thể giúp giảm bắt nạt không?","a":"Có, tăng gắn kết."},{"id":556,"q":"Dạy kỹ năng sống có cần thiết không?","a":"Rất cần thiết."},{"id":557,"q":"Phụ huynh cần làm gì?","a":"Quan tâm và lắng nghe con."},{"id":558,"q":"Có nên tổ chức chuyên đề phòng chống bạo lực?","a":"Có, giúp nâng cao nhận thức."},{"id":559,"q":"Học sinh làm gương có tác dụng không?","a":"Có, tạo ảnh hưởng tích cực."},{"id":560,"q":"Tôn trọng sự khác biệt có giúp giảm bắt nạt không?","a":"Có."},{"id":561,"q":"Chế tài rõ ràng có quan trọng không?","a":"Có."},{"id":562,"q":"Xây dựng văn hóa xin lỗi có cần không?","a":"Có."},{"id":563,"q":"Giao tiếp tích cực có vai trò gì?","a":"Giảm hiểu lầm."},{"id":564,"q":"Khuyến khích chia sẻ cảm xúc có lợi không?","a":"Có."},{"id":565,"q":"Tổ chức tư vấn định kỳ có cần không?","a":"Có."},{"id":566,"q":"Câu lạc bộ kỹ năng có giúp không?","a":"Có."},{"id":567,"q":"Học sinh cần học điều gì?","a":"Kiểm soát cảm xúc."},{"id":568,"q":"Thầy cô cần quan sát điều gì?","a":"Biểu hiện thay đổi bất thường."},{"id":569,"q":"Có nên thưởng hành vi tích cực?","a":"Có."},{"id":570,"q":"Bầu không khí lớp học ảnh hưởng thế nào?","a":"Ảnh hưởng trực tiếp đến hành vi."},{"id":571,"q":"Giá trị cốt lõi nên xây dựng là gì?","a":"Tôn trọng và trách nhiệm."},{"id":572,"q":"Tăng cường hoạt động nhóm có lợi không?","a":"Có."},{"id":573,"q":"Hợp tác gia đình – nhà trường quan trọng không?","a":"Rất quan trọng."},{"id":574,"q":"Lắng nghe học sinh có cần không?","a":"Rất cần."},{"id":575,"q":"Giáo dục cảm xúc xã hội có ích không?","a":"Có."},{"id":576,"q":"Xây dựng lớp học hạnh phúc giúp gì?","a":"Giảm bạo lực."},{"id":577,"q":"Phát hiện sớm có ý nghĩa gì?","a":"Ngăn hậu quả nặng nề."},{"id":578,"q":"Học sinh nên học cách nói “không” không?","a":"Có."},{"id":579,"q":"Khuyến khích sự đồng cảm có lợi không?","a":"Có."},{"id":580,"q":"Văn hóa trường học quyết định điều gì?","a":"Mức độ an toàn. ---"},{"id":581,"q":"Người chứng kiến bắt nạt có trách nhiệm gì?","a":"Không cổ vũ và báo người lớn."},{"id":582,"q":"Im lặng có phải trung lập không?","a":"Không, có thể là tiếp tay."},{"id":583,"q":"Cách hỗ trợ bạn bị bắt nạt?","a":"Ở bên và động viên."},{"id":584,"q":"Có nên quay clip đánh nhau?","a":"Không."},{"id":585,"q":"Báo giáo viên có bị coi là “mách lẻo”?","a":"Không, đó là hành động bảo vệ."},{"id":586,"q":"Đồng cảm giúp gì?","a":"Giảm tổn thương."},{"id":587,"q":"Tập thể có sức mạnh không?","a":"Có, có thể ngăn chặn bạo lực."},{"id":588,"q":"Nói “dừng lại” có hiệu quả không?","a":"Có, nếu nhiều người cùng lên tiếng."},{"id":589,"q":"Sự thờ ơ gây hậu quả gì?","a":"Khiến nạn nhân cô đơn."},{"id":590,"q":"Tại sao nên đứng về phía điều đúng?","a":"Vì an toàn chung."},{"id":591,"q":"Hành động nhỏ có ý nghĩa không?","a":"Có."},{"id":592,"q":"Khuyến khích bạn chia sẻ có tốt không?","a":"Có."},{"id":593,"q":"Làm bạn đồng hành có giúp gì?","a":"Giúp nạn nhân bớt sợ."},{"id":594,"q":"Có nên can thiệp trực tiếp?","a":"Chỉ khi an toàn."},{"id":595,"q":"Báo ẩn danh có được không?","a":"Có."},{"id":596,"q":"Văn hóa “không bạo lực” cần ai xây dựng?","a":"Tất cả mọi người."},{"id":597,"q":"Cổ vũ hòa giải có tốt không?","a":"Có."},{"id":598,"q":"Lan tỏa điều tích cực có tác dụng gì?","a":"Giảm hành vi xấu."},{"id":599,"q":"Tại sao không nên cười khi bạn bị trêu?","a":"Làm bạn thêm tổn thương."},{"id":600,"q":"Thông điệp quan trọng nhất?","a":"Mỗi học sinh đều xứng đáng được tôn trọng."},{"id":601,"q":"Áp lực thi cử là gì?","a":"Là trạng thái căng thẳng khi học sinh lo lắng về kết quả học tập. Áp lực vừa phải giúp cố gắng, nhưng quá mức sẽ gây stress."},{"id":602,"q":"Vì sao học sinh sợ thi?","a":"Vì lo điểm kém, sợ bị so sánh hoặc làm bố mẹ thất vọng. Nỗi sợ thường đến từ kỳ vọng cao."},{"id":603,"q":"Lo lắng trước kỳ thi có bình thường không?","a":"Có, đó là phản ứng tự nhiên. Quan trọng là biết kiểm soát để không ảnh hưởng sức khỏe."},{"id":604,"q":"Áp lực có thể gây mất ngủ không?","a":"Có. Căng thẳng khiến não hoạt động liên tục, khó thư giãn."},{"id":605,"q":"Dấu hiệu stress trước thi là gì?","a":"Đau đầu, tim đập nhanh, khó tập trung, cáu gắt."},{"id":606,"q":"So sánh điểm số có làm tăng áp lực không?","a":"Có. So sánh khiến học sinh tự ti hoặc ganh đua tiêu cực."},{"id":607,"q":"Áp lực từ gia đình ảnh hưởng thế nào?","a":"Khi kỳ vọng quá cao, học sinh dễ cảm thấy sợ sai và mất tự tin."},{"id":608,"q":"Áp lực có làm giảm kết quả thi không?","a":"Có. Căng thẳng quá mức khiến trí nhớ và khả năng tập trung giảm."},{"id":609,"q":"Học quá nhiều trước ngày thi có hiệu quả không?","a":"Không hẳn. Nhồi nhét dễ khiến não quá tải."},{"id":610,"q":"Sợ bị mắng khi điểm kém có gây lo âu không?","a":"Có. Nỗi sợ bị phán xét làm tăng stress."},{"id":611,"q":"Áp lực thành tích khác gì động lực?","a":"Động lực giúp tiến bộ tích cực, còn áp lực khiến sợ hãi và mệt mỏi."},{"id":612,"q":"Thi cử có quyết định toàn bộ tương lai không?","a":"Không. Một kỳ thi không định nghĩa giá trị của bạn."},{"id":613,"q":"Mất tự tin trước thi có phổ biến không?","a":"Có. Nhiều học sinh nghi ngờ khả năng của mình dù đã chuẩn bị tốt."},{"id":614,"q":"Suy nghĩ “mình chắc chắn trượt” có nguy hiểm không?","a":"Có. Suy nghĩ tiêu cực làm giảm hiệu suất thực tế."},{"id":615,"q":"Áp lực kéo dài có ảnh hưởng sức khỏe không?","a":"Có. Có thể gây mệt mỏi, đau dạ dày, giảm miễn dịch."},{"id":616,"q":"Ngủ ít để học thêm có nên không?","a":"Không. Giấc ngủ giúp củng cố trí nhớ."},{"id":617,"q":"Cảm giác run tay khi thi có bình thường không?","a":"Có. Đó là phản ứng sinh lý khi lo lắng."},{"id":618,"q":"Sợ vào phòng thi có phải yếu đuối không?","a":"Không. Ai cũng có cảm xúc lo lắng."},{"id":619,"q":"Áp lực có thể khiến quên bài không?","a":"Có. Stress cao làm giảm khả năng truy xuất trí nhớ."},{"id":620,"q":"Điều quan trọng nhất khi đối diện áp lực là gì?","a":"Nhận diện cảm xúc và tìm cách điều chỉnh thay vì né tránh. ---"},{"id":621,"q":"Hít thở sâu có giúp giảm căng thẳng không?","a":"Có. Thở chậm giúp hệ thần kinh thư giãn."},{"id":622,"q":"Lập kế hoạch học tập có giúp giảm lo lắng không?","a":"Có. Kế hoạch rõ ràng giúp bạn cảm thấy kiểm soát được tình hình."},{"id":623,"q":"Chia nhỏ mục tiêu có lợi không?","a":"Có. Hoàn thành từng phần nhỏ tạo cảm giác thành công."},{"id":624,"q":"Nghỉ giải lao khi học có cần thiết không?","a":"Có. Não cần thời gian nghỉ để xử lý thông tin."},{"id":625,"q":"Tập thể dục trước kỳ thi có tốt không?","a":"Có. Vận động giúp giảm hormone căng thẳng."},{"id":626,"q":"Nghe nhạc nhẹ có giúp thư giãn không?","a":"Có. Âm nhạc làm dịu cảm xúc."},{"id":627,"q":"Nói chuyện với bạn bè có giảm áp lực không?","a":"Có. Chia sẻ giúp bạn thấy mình không đơn độc."},{"id":628,"q":"Tự khích lệ bản thân có tác dụng không?","a":"Có. Lời nói tích cực giúp tăng tự tin."},{"id":629,"q":"Học nhóm có hiệu quả không?","a":"Có, nếu nhóm nghiêm túc. Học nhóm giúp trao đổi kiến thức và giảm căng thẳng."},{"id":630,"q":"Viết ra điều mình lo lắng có giúp ích không?","a":"Có. Viết giúp làm rõ suy nghĩ và giảm rối trí."},{"id":631,"q":"Thi thử có cần thiết không?","a":"Có. Làm quen đề giúp giảm lo lắng khi thi thật."},{"id":632,"q":"Uống quá nhiều cà phê trước thi có nên không?","a":"Không. Caffeine quá mức làm tim đập nhanh và khó tập trung."},{"id":633,"q":"Ngủ đủ trước ngày thi có quan trọng không?","a":"Rất quan trọng. Giấc ngủ giúp não ghi nhớ tốt hơn."},{"id":634,"q":"Tưởng tượng mình làm bài tốt có hiệu quả không?","a":"Có. Hình dung tích cực giúp tăng tự tin."},{"id":635,"q":"Sắp xếp góc học tập gọn gàng có giúp tập trung không?","a":"Có. Môi trường gọn gàng giảm phân tán."},{"id":636,"q":"So sánh mình với người khác có nên không?","a":"Không. Mỗi người có tốc độ học khác nhau."},{"id":637,"q":"Thiền ngắn 5 phút có tác dụng không?","a":"Có. Giúp não thư giãn nhanh."},{"id":638,"q":"Tự thưởng sau khi học xong có nên không?","a":"Có. Phần thưởng nhỏ giúp duy trì động lực."},{"id":639,"q":"Nói chuyện với thầy cô khi lo lắng có nên không?","a":"Có. Thầy cô có thể hướng dẫn cách học hiệu quả."},{"id":640,"q":"Tự trách khi làm sai có tốt không?","a":"Không. Nên rút kinh nghiệm thay vì tự phán xét. ---"},{"id":651,"q":"Điểm thấp có nghĩa là thất bại không?","a":"Không. Đó chỉ là phản hồi để cải thiện."},{"id":652,"q":"Nên làm gì khi nhận điểm kém?","a":"Bình tĩnh xem lại lỗi sai để rút kinh nghiệm."},{"id":653,"q":"Có nên giấu điểm kém không?","a":"Không. Trung thực giúp nhận được hỗ trợ."},{"id":654,"q":"Cảm thấy xấu hổ vì điểm thấp có bình thường không?","a":"Có. Nhưng không nên để cảm xúc đó kéo dài."},{"id":655,"q":"Điểm số có phản ánh toàn bộ năng lực không?","a":"Không. Năng lực còn gồm kỹ năng và thái độ."},{"id":656,"q":"So sánh điểm với bạn có cần thiết không?","a":"Không. Tập trung vào tiến bộ của bản thân tốt hơn."},{"id":657,"q":"Cha mẹ nên phản ứng thế nào khi con điểm kém?","a":"Lắng nghe và động viên thay vì chỉ trích."},{"id":658,"q":"Tự đánh giá lại cách học có cần không?","a":"Có. Có thể phương pháp chưa phù hợp."},{"id":659,"q":"Thất vọng sau thi có nên chấp nhận không?","a":"Có. Chấp nhận cảm xúc giúp vượt qua nhanh hơn."},{"id":660,"q":"Có nên bỏ cuộc sau một lần thất bại?","a":"Không. Thành công cần quá trình. ---"},{"id":676,"q":"Động lực nội tại là gì?","a":"Là mong muốn học vì yêu thích và phát triển bản thân."},{"id":677,"q":"Học vì sợ phạt có bền vững không?","a":"Không. Động lực dựa trên sợ hãi thường không lâu dài."},{"id":678,"q":"Đặt mục tiêu rõ ràng có giúp học tốt hơn không?","a":"Có. Mục tiêu rõ giúp định hướng hành động."},{"id":679,"q":"Khen ngợi nỗ lực có quan trọng không?","a":"Có. Ghi nhận cố gắng giúp tăng tự tin."},{"id":680,"q":"Tự tin có ảnh hưởng đến kết quả học tập không?","a":"Có. Tự tin giúp bạn bình tĩnh và tập trung."},{"id":681,"q":"Học vì tương lai có ý nghĩa gì?","a":"Giúp bạn có định hướng dài hạn và ý thức trách nhiệm."},{"id":682,"q":"Đặt mục tiêu quá cao có tốt không?","a":"Không. Mục tiêu quá xa dễ gây áp lực."},{"id":683,"q":"Ghi nhận tiến bộ nhỏ có cần không?","a":"Có. Tiến bộ nhỏ tạo động lực lớn."},{"id":684,"q":"Tìm niềm vui trong học tập có quan trọng không?","a":"Có. Niềm vui giúp duy trì hứng thú."},{"id":685,"q":"Lập thời gian biểu có lợi gì?","a":"Giúp cân bằng học và nghỉ."},{"id":686,"q":"Học liên tục nhiều giờ có hiệu quả không?","a":"Không. Não cần nghỉ để tái tạo năng lượng."},{"id":687,"q":"Có nên thay đổi phương pháp học khi không hiệu quả?","a":"Có. Linh hoạt giúp tìm ra cách phù hợp."},{"id":688,"q":"Học tập là cuộc đua hay hành trình?","a":"Là hành trình phát triển bản thân."},{"id":689,"q":"Sự ủng hộ từ gia đình có quan trọng không?","a":"Rất quan trọng. Sự động viên giúp giảm áp lực."},{"id":690,"q":"Giá trị của bạn có phụ thuộc vào điểm số không?","a":"Không. Bạn có giá trị riêng ngoài thành tích học tập."},{"id":701,"q":"Vì sao con cái thường cãi lời cha mẹ ở tuổi THCS?","a":"Vì đây là giai đoạn muốn khẳng định bản thân và độc lập hơn. Sự khác biệt quan điểm dễ dẫn đến xung đột."},{"id":702,"q":"Mâu thuẫn với cha mẹ có bình thường không?","a":"Có. Khác biệt thế hệ là điều tự nhiên, quan trọng là cách giải quyết."},{"id":703,"q":"Vì sao cha mẹ hay nhắc nhở nhiều?","a":"Vì lo lắng và muốn con phát triển tốt. Tuy nhiên cách thể hiện đôi khi làm con khó chịu."},{"id":704,"q":"Cảm thấy “bố mẹ không hiểu mình” có phổ biến không?","a":"Có. Do thiếu chia sẻ cảm xúc và góc nhìn khác nhau."},{"id":705,"q":"Khi bị so sánh với “con nhà người ta”, nên làm gì?","a":"Bình tĩnh bày tỏ cảm xúc của mình thay vì phản ứng tiêu cực."},{"id":706,"q":"Cha mẹ kiểm soát điện thoại có phải không tin con?","a":"Không hẳn. Thường là vì lo an toàn, nhưng cần trao đổi để thống nhất."},{"id":707,"q":"La mắng có giúp con tiến bộ không?","a":"Thường không hiệu quả lâu dài. Lắng nghe và hướng dẫn tích cực sẽ tốt hơn."},{"id":708,"q":"Im lặng khi giận cha mẹ có tốt không?","a":"Không nên kéo dài. Giữ im lặng lâu khiến hiểu lầm sâu hơn."},{"id":709,"q":"Cha mẹ áp đặt nghề nghiệp có ảnh hưởng gì?","a":"Có thể làm con mất động lực và cảm thấy không được tôn trọng."},{"id":710,"q":"Cãi vã trước mặt người khác có nên không?","a":"Không. Điều đó làm tổn thương và giảm sự tôn trọng lẫn nhau."},{"id":711,"q":"Vì sao cha mẹ hay lo điểm số?","a":"Vì nghĩ học tập quyết định tương lai. Tuy nhiên cần cân bằng với sức khỏe tinh thần."},{"id":712,"q":"Khác biệt thế hệ ảnh hưởng thế nào?","a":"Mỗi thế hệ có cách suy nghĩ khác, cần học cách thấu hiểu."},{"id":713,"q":"Khi cha mẹ không cho đi chơi, nên làm gì?","a":"Hỏi rõ lý do và thương lượng thay vì phản ứng gay gắt."},{"id":714,"q":"Nói dối để tránh bị mắng có nên không?","a":"Không. Nói dối làm mất niềm tin lâu dài."},{"id":715,"q":"Cha mẹ nghiêm khắc có phải không yêu con?","a":"Không. Nhiều khi đó là cách thể hiện tình thương theo cách họ biết."},{"id":716,"q":"Khi cảm thấy bất công, nên làm gì?","a":"Chia sẻ cảm xúc bằng lời lẽ tôn trọng."},{"id":717,"q":"So sánh anh chị em trong nhà có gây tổn thương không?","a":"Có. Điều đó dễ làm con tự ti hoặc ganh tị."},{"id":718,"q":"Tại sao cần hiểu góc nhìn của cha mẹ?","a":"Vì họ có kinh nghiệm sống và mong điều tốt cho con."},{"id":719,"q":"Tránh mặt cha mẹ khi giận có giải quyết vấn đề không?","a":"Không. Tránh né chỉ làm khoảng cách xa hơn."},{"id":720,"q":"Điều quan trọng nhất khi có mâu thuẫn là gì?","a":"Giao tiếp bình tĩnh và tôn trọng lẫn nhau. ---"},{"id":721,"q":"Làm sao để nói chuyện khi đang giận?","a":"Đợi bình tĩnh rồi mới trao đổi. Khi cảm xúc ổn định, lời nói sẽ tích cực hơn."},{"id":722,"q":"Nên bắt đầu cuộc nói chuyện khó bằng cách nào?","a":"Bắt đầu bằng cảm xúc của mình thay vì обвин buộc người khác."},{"id":723,"q":"Câu “Con cảm thấy…” có tác dụng gì?","a":"Giúp diễn đạt cảm xúc mà không gây đối đầu."},{"id":724,"q":"Có nên cắt lời cha mẹ khi họ đang nói?","a":"Không. Lắng nghe thể hiện sự tôn trọng."},{"id":725,"q":"Viết thư cho cha mẹ có hiệu quả không?","a":"Có. Khi khó nói trực tiếp, viết giúp diễn đạt rõ hơn."},{"id":726,"q":"Tông giọng ảnh hưởng thế nào?","a":"Giọng bình tĩnh giúp cuộc trò chuyện hiệu quả hơn."},{"id":727,"q":"Nên chọn thời điểm nói chuyện khi nào?","a":"Khi cả hai đều thoải mái, không căng thẳng."},{"id":728,"q":"Xin lỗi cha mẹ có làm mất “thể diện” không?","a":"Không. Xin lỗi thể hiện sự trưởng thành."},{"id":729,"q":"Có nên nói hết suy nghĩ một lúc không?","a":"Nên chia nhỏ vấn đề để trao đổi từng bước."},{"id":730,"q":"Lắng nghe chủ động là gì?","a":"Là nghe để hiểu, không phải nghe để phản bác."},{"id":731,"q":"Cha mẹ cũng cần được lắng nghe không?","a":"Có. Họ cũng có cảm xúc và áp lực riêng."},{"id":732,"q":"Có nên nhờ người trung gian khi mâu thuẫn lớn?","a":"Có. Thầy cô hoặc người thân có thể hỗ trợ hòa giải."},{"id":733,"q":"Giao tiếp qua tin nhắn có hiệu quả không?","a":"Có thể, nhưng nói trực tiếp vẫn tốt hơn để tránh hiểu lầm."},{"id":734,"q":"Nói trong lúc tức giận có nguy hiểm không?","a":"Có. Lời nói nóng giận dễ gây tổn thương lâu dài."},{"id":735,"q":"Thỏa thuận hai bên có cần thiết không?","a":"Có. Thỏa thuận giúp cả hai cảm thấy được tôn trọng."},{"id":736,"q":"Khi cha mẹ chưa đồng ý, nên làm gì?","a":"Tiếp tục trao đổi thay vì bỏ cuộc."},{"id":737,"q":"Có nên lớn tiếng để chứng minh mình đúng?","a":"Không. Lớn tiếng không đồng nghĩa với đúng."},{"id":738,"q":"Tôn trọng khác biệt có quan trọng không?","a":"Rất quan trọng. Tôn trọng giúp duy trì quan hệ bền vững."},{"id":739,"q":"Cảm ơn cha mẹ có cần nói ra không?","a":"Có. Lời cảm ơn giúp gắn kết tình cảm."},{"id":740,"q":"Điều cốt lõi của giao tiếp gia đình là gì?","a":"Sự thấu hiểu và tôn trọng. ---"},{"id":751,"q":"Kỳ vọng của cha mẹ có tốt không?","a":"Tốt nếu vừa phải và thực tế. Quá cao dễ gây áp lực."},{"id":752,"q":"Làm sao khi cảm thấy không đạt được mong đợi?","a":"Chia sẻ thật lòng thay vì chịu đựng một mình."},{"id":753,"q":"Kỳ vọng quá mức ảnh hưởng thế nào?","a":"Gây stress, tự ti và sợ thất bại."},{"id":754,"q":"Cha mẹ nên làm gì khi con áp lực?","a":"Lắng nghe và điều chỉnh kỳ vọng."},{"id":755,"q":"Con nên làm gì khi bị ép học thêm quá nhiều?","a":"Trao đổi về sức khỏe và khả năng của mình."},{"id":756,"q":"Thành tích có phải cách duy nhất làm cha mẹ vui?","a":"Không. Sự trưởng thành và hạnh phúc cũng rất quan trọng."},{"id":757,"q":"So sánh với anh chị có gây áp lực không?","a":"Có. Mỗi người có điểm mạnh riêng."},{"id":758,"q":"Nên làm gì khi không thích ngành cha mẹ chọn?","a":"Trao đổi rõ mong muốn và tìm điểm chung."},{"id":759,"q":"Có nên chịu đựng im lặng vì sợ làm cha mẹ buồn?","a":"Không. Chia sẻ giúp hiểu nhau hơn."},{"id":760,"q":"Điều quan trọng hơn thành tích là gì?","a":"Sức khỏe tinh thần và nhân cách. ---"},{"id":776,"q":"Làm gì để gia đình gần gũi hơn?","a":"Dành thời gian ăn cơm và trò chuyện cùng nhau."},{"id":777,"q":"Chia sẻ việc nhà có ý nghĩa gì?","a":"Tạo tinh thần trách nhiệm và gắn kết."},{"id":778,"q":"Lắng nghe nhau mỗi ngày có quan trọng không?","a":"Có. Sự quan tâm nhỏ tạo niềm tin lớn."},{"id":779,"q":"Hoạt động chung cuối tuần có lợi gì?","a":"Tăng kỷ niệm tích cực và giảm khoảng cách."},{"id":780,"q":"Khen ngợi trong gia đình có cần không?","a":"Có. Lời khen giúp tăng sự tự tin."},{"id":781,"q":"Tôn trọng riêng tư của con có quan trọng không?","a":"Có. Riêng tư giúp con phát triển cá tính."},{"id":782,"q":"Con nên thể hiện tình cảm với cha mẹ thế nào?","a":"Bằng lời nói, hành động và sự quan tâm."},{"id":783,"q":"Gia đình hạnh phúc có phải không có mâu thuẫn?","a":"Không. Hạnh phúc là biết giải quyết mâu thuẫn tích cực."},{"id":784,"q":"Sự tin tưởng trong gia đình được xây dựng thế nào?","a":"Bằng trung thực và nhất quán."},{"id":785,"q":"Tha thứ trong gia đình có cần không?","a":"Rất cần. Tha thứ giúp chữa lành tổn thương."},{"id":801,"q":"Tự ti là gì?","a":"Là cảm giác mình kém cỏi hoặc không đủ tốt. Nếu kéo dài, tự ti có thể ảnh hưởng đến học tập và các mối quan hệ."},{"id":802,"q":"Vì sao học sinh THCS dễ tự ti?","a":"Vì đây là giai đoạn thay đổi mạnh về cơ thể và tâm lý, các em nhạy cảm với lời nhận xét của người khác."},{"id":803,"q":"So sánh bản thân với bạn bè có gây tự ti không?","a":"Có. So sánh liên tục khiến mình chỉ nhìn thấy điểm yếu thay vì điểm mạnh."},{"id":804,"q":"Bị chê ngoại hình có ảnh hưởng lâu dài không?","a":"Có thể. Lời chê lặp lại nhiều lần làm giảm lòng tự trọng."},{"id":805,"q":"Tự ti có phải là yếu đuối không?","a":"Không. Đó là cảm xúc phổ biến và có thể vượt qua được."},{"id":806,"q":"Dấu hiệu của tự ti là gì?","a":"Ngại phát biểu, sợ bị chú ý, thường tự chê mình."},{"id":807,"q":"Tự ti có làm giảm kết quả học tập không?","a":"Có. Khi thiếu tự tin, học sinh dễ bỏ lỡ cơ hội thể hiện năng lực."},{"id":808,"q":"Sợ người khác đánh giá có phải tự ti không?","a":"Thường là vậy. Người tự ti rất nhạy cảm với nhận xét."},{"id":809,"q":"Tự ti và khiêm tốn có giống nhau không?","a":"Không. Khiêm tốn là biết mình biết ta, còn tự ti là đánh giá thấp bản thân."},{"id":810,"q":"Tự ti kéo dài có gây lo âu không?","a":"Có. Cảm giác không đủ tốt dễ dẫn đến stress."},{"id":811,"q":"Bị điểm thấp có làm tăng tự ti không?","a":"Có thể. Nếu xem điểm số là thước đo giá trị bản thân."},{"id":812,"q":"Tự ti về giọng nói có phổ biến không?","a":"Có. Ở tuổi dậy thì, giọng nói thay đổi nên nhiều em ngại giao tiếp."},{"id":813,"q":"Tự ti có khiến ngại kết bạn không?","a":"Có. Sợ bị từ chối khiến học sinh thu mình."},{"id":814,"q":"Lời nói đùa về ngoại hình có gây tự ti không?","a":"Có. Dù là đùa, lời nói vẫn có thể gây tổn thương."},{"id":815,"q":"Tự ti có thể thay đổi được không?","a":"Có. Khi nhận ra giá trị bản thân và rèn luyện kỹ năng."},{"id":816,"q":"Mạng xã hội có làm tăng tự ti không?","a":"Có thể. Hình ảnh “hoàn hảo” trên mạng dễ khiến học sinh so sánh tiêu cực."},{"id":817,"q":"Tự ti có liên quan đến lòng tự trọng không?","a":"Có. Lòng tự trọng thấp thường đi kèm tự ti."},{"id":818,"q":"Người tự ti có nhận ra mình tự ti không?","a":"Không phải lúc nào cũng nhận ra. Họ thường nghĩ mình “thực sự kém”."},{"id":819,"q":"Tự ti có thể khiến học sinh né tránh hoạt động không?","a":"Có. Vì sợ thất bại hoặc bị chê cười."},{"id":820,"q":"Điều quan trọng nhất khi nhận ra mình tự ti là gì?","a":"Chấp nhận cảm xúc và tìm cách cải thiện từng bước. ---"},{"id":826,"q":"Hình ảnh bản thân là gì?","a":"Là cách bạn nhìn nhận và đánh giá chính mình, bao gồm ngoại hình và tính cách."},{"id":827,"q":"Ngoại hình có quyết định giá trị con người không?","a":"Không. Giá trị còn nằm ở nhân cách và hành động."},{"id":828,"q":"Vì sao nhiều bạn lo lắng về cân nặng?","a":"Vì chịu ảnh hưởng chuẩn mực đẹp từ bạn bè và mạng xã hội."},{"id":829,"q":"Bị mụn ở tuổi dậy thì có bình thường không?","a":"Rất bình thường. Đây là thay đổi sinh lý tự nhiên."},{"id":830,"q":"Cao thấp có quyết định sự thành công không?","a":"Không. Thành công phụ thuộc vào kỹ năng và nỗ lực."},{"id":831,"q":"Soi gương và chỉ thấy khuyết điểm có tốt không?","a":"Không. Nên học cách nhìn cả điểm mạnh của mình."},{"id":832,"q":"Có nên ăn kiêng cực đoan để đẹp hơn không?","a":"Không. Điều đó ảnh hưởng sức khỏe."},{"id":833,"q":"Trang điểm ở tuổi THCS có cần thiết không?","a":"Không bắt buộc. Quan trọng là sự tự nhiên và phù hợp môi trường học đường."},{"id":834,"q":"Tự chăm sóc bản thân có giúp tăng tự tin không?","a":"Có. Chăm sóc tốt giúp cảm thấy mình có giá trị."},{"id":835,"q":"Bị trêu vì ngoại hình nên làm gì?","a":"Giữ bình tĩnh và tìm sự hỗ trợ nếu bị lặp lại nhiều lần."},{"id":836,"q":"Thần tượng trên mạng có phải chuẩn mực thực tế không?","a":"Không hẳn. Nhiều hình ảnh đã qua chỉnh sửa."},{"id":837,"q":"Tập thể dục có giúp cải thiện hình ảnh bản thân không?","a":"Có. Vừa tốt cho sức khỏe vừa tăng tự tin."},{"id":838,"q":"So sánh cơ thể với người khác có nên không?","a":"Không. Mỗi cơ thể có tốc độ phát triển khác nhau."},{"id":839,"q":"Tóc, da, chiều cao thay đổi thất thường có bình thường không?","a":"Có. Đó là đặc điểm của tuổi dậy thì."},{"id":840,"q":"Chấp nhận cơ thể mình có quan trọng không?","a":"Rất quan trọng. Chấp nhận giúp giảm áp lực tâm lý. ---"},{"id":851,"q":"Dậy thì là gì?","a":"Là giai đoạn cơ thể và cảm xúc thay đổi mạnh để trưởng thành."},{"id":852,"q":"Tâm trạng thất thường ở tuổi dậy thì có bình thường không?","a":"Có. Hormone thay đổi ảnh hưởng đến cảm xúc."},{"id":853,"q":"Dễ cáu gắt có phải do hư không?","a":"Không. Thường do biến đổi sinh lý và stress."},{"id":854,"q":"Cảm xúc buồn vô cớ có phổ biến không?","a":"Có. Điều quan trọng là biết chia sẻ."},{"id":855,"q":"Thích một ai đó ở tuổi này có bình thường không?","a":"Có. Đó là cảm xúc tự nhiên của quá trình trưởng thành."},{"id":856,"q":"Cần làm gì khi thấy cơ thể thay đổi nhanh?","a":"Tìm hiểu kiến thức đúng và trao đổi với người lớn tin cậy."},{"id":857,"q":"Con trai vỡ giọng có bình thường không?","a":"Hoàn toàn bình thường trong quá trình phát triển."},{"id":858,"q":"Con gái có kinh nguyệt lần đầu nên làm gì?","a":"Bình tĩnh và tìm sự hướng dẫn từ mẹ hoặc người lớn."},{"id":859,"q":"Tại sao tuổi dậy thì dễ xấu hổ?","a":"Vì nhận thức về bản thân tăng cao."},{"id":860,"q":"Có nên tìm hiểu kiến thức giới tính chính thống không?","a":"Có. Kiến thức đúng giúp tránh hiểu lầm và lo lắng. ---"},{"id":876,"q":"Tự tin là gì?","a":"Là tin vào khả năng và giá trị của mình."},{"id":877,"q":"Tự tin có thể rèn luyện được không?","a":"Có. Qua trải nghiệm và thực hành."},{"id":878,"q":"Nói trước gương có giúp tăng tự tin không?","a":"Có. Giúp luyện kỹ năng giao tiếp."},{"id":879,"q":"Ghi lại điểm mạnh của mình có lợi không?","a":"Có. Giúp nhìn rõ giá trị bản thân."},{"id":880,"q":"Tham gia hoạt động ngoại khóa có giúp giảm tự ti không?","a":"Có. Thành công nhỏ tạo động lực lớn."},{"id":881,"q":"Tự tha thứ cho lỗi sai có cần không?","a":"Rất cần. Ai cũng có quyền sai và sửa."},{"id":882,"q":"Tư duy tích cực có giúp cải thiện tự ti không?","a":"Có. Cách suy nghĩ ảnh hưởng cảm xúc."},{"id":883,"q":"Kết bạn với người tích cực có quan trọng không?","a":"Có. Môi trường ảnh hưởng sự tự tin."},{"id":884,"q":"Thử điều mới có giúp phát triển bản thân không?","a":"Có. Trải nghiệm giúp mở rộng khả năng."},{"id":885,"q":"Tự tin có nghĩa là không sợ hãi?","a":"Không. Tự tin là dám hành động dù còn lo lắng."},{"id":886,"q":"Khen bản thân mỗi ngày có ích không?","a":"Có. Lời khích lệ giúp tăng lòng tự trọng."},{"id":887,"q":"Viết nhật ký thành công nhỏ có nên không?","a":"Có. Ghi nhận tiến bộ giúp duy trì động lực."},{"id":888,"q":"Sự kiên trì có liên quan đến tự tin không?","a":"Có. Khi vượt qua thử thách, bạn tin mình hơn."},{"id":889,"q":"Có nên tìm sự hỗ trợ khi tự ti kéo dài?","a":"Có. Chuyên viên tư vấn có thể giúp."},{"id":890,"q":"Giá trị bản thân có phụ thuộc ngoại hình không?","a":"Không. Giá trị nằm ở nhân cách và hành động."},{"id":901,"q":"Sức khỏe tinh thần là gì?","a":"Là trạng thái cảm xúc, suy nghĩ và hành vi ổn định, giúp ta học tập và sinh hoạt bình thường."},{"id":902,"q":"Buồn nhiều ngày liên tục có đáng lo không?","a":"Có. Nếu buồn kéo dài trên 2 tuần và không rõ lý do, nên tìm người hỗ trợ."},{"id":903,"q":"Lo âu khác gì căng thẳng thông thường?","a":"Lo âu kéo dài và khó kiểm soát hơn, ảnh hưởng đến sinh hoạt hàng ngày."},{"id":904,"q":"Mất hứng thú với mọi việc có phải dấu hiệu bất thường không?","a":"Có thể. Đây là dấu hiệu cảnh báo cần quan tâm."},{"id":905,"q":"Thường xuyên mệt mỏi dù ngủ đủ có sao không?","a":"Có thể liên quan đến stress hoặc cảm xúc tiêu cực kéo dài."},{"id":906,"q":"Khóc nhiều có phải yếu đuối không?","a":"Không. Khóc là cách cơ thể giải tỏa cảm xúc."},{"id":907,"q":"Hay suy nghĩ tiêu cực có nguy hiểm không?","a":"Có. Suy nghĩ lặp lại tiêu cực có thể dẫn đến trầm cảm."},{"id":908,"q":"Trầm cảm là gì?","a":"Là tình trạng buồn bã, mất năng lượng kéo dài và cần được hỗ   function normalize(s){
    return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d");
  }

  function escapeHtml(s){
    const d=document.createElement("div"); d.textContent=s; return d.innerHTML;
  }

  function scrollBottom(){
    requestAnimationFrame(()=>{messages.scrollTop=messages.scrollHeight});
  }

  function addMessage(text,type){
    const el=document.createElement("div");
    el.className="message "+(type==="user"?"user-message":"bot-message");
    if(type==="bot"){
      el.innerHTML='<div class="bot-avatar">👩‍⚕️</div><div class="message-content">'+text+'</div>';
    }else{
      el.innerHTML='<div class="message-content">'+escapeHtml(text)+'</div>';
    }
    messages.appendChild(el);
    scrollBottom();
  }

  function showTyping(){
    const el=document.createElement("div");
    el.className="message bot-message";
    el.id="typingMessage";
    el.innerHTML='<div class="bot-avatar">👩‍⚕️</div><div class="message-content typing"><i></i><i></i><i></i></div>';
    messages.appendChild(el); scrollBottom();
  }

  function getWords(text){
    const stop = new Set([
      "em","co","cô","toi","tôi","minh","mình","la","là","gi","gì","the","thế","nao","nào","sao","a","ạ","cho","mot","một","nhu","như","co","cô","voi","với","va","và","hay","co","có","khong","không","bi","bị","dang","đang","rat","rất","lam","làm","de","để","khi","vi","vì","thi","thì","se","sẽ","can","cần","nen","nên","phai","phải","duoc","được"
    ]);
    return normalize(text)
      .split(/[^a-z0-9]+/)
      .filter(w => w.length >= 2 && !stop.has(w));
  }

  function answer(text){
    const q = normalize(text);
    const queryWords = getWords(text);

    if(!queryWords.length){
      return "Cô Hường đang lắng nghe em 💜 Em hãy kể cho cô điều em đang suy nghĩ hoặc điều khiến em lo lắng nhé.";
    }

    let best = null;
    let bestScore = 0;

    for(const item of knowledge){
      const words = getWords(item.q);
      if(!words.length) continue;

      let score = 0;
      const unique = new Set(words);

      for(const w of queryWords){
        if(unique.has(w)) score += 1;
      }

      // Thưởng cho cụm từ giống nhau, giúp nhận diện câu hỏi gần giống mẫu.
      const phrase = queryWords.slice(0, 5).join(" ");
      if(phrase && normalize(item.q).includes(phrase)) score += 2;

      // Ưu tiên câu trả lời có nhiều từ khóa trùng khớp.
      const ratio = score / Math.max(2, queryWords.length);
      const finalScore = score + ratio * 2;

      if(finalScore > bestScore){
        bestScore = finalScore;
        best = item;
      }
    }

    // Chỉ dùng kiến thức khi có mức độ khớp đủ tốt, tránh trả lời ngẫu nhiên.
    if(best && (bestScore >= 2.2 || (queryWords.length <= 3 && bestScore >= 1.5))){
      return escapeHtml(best.a);
    }

    return `<p>Cô Hường đang lắng nghe em 💜</p>
            <p>Cô chưa tìm thấy câu trả lời thật sát với điều em vừa hỏi.</p>
            <p>Em có thể nói cụ thể hơn về <b>cảm xúc, học tập, áp lực thi cử, bạn bè, bạo lực học đường, gia đình, tuổi dậy thì, sự tự tin hoặc sức khỏe tinh thần</b>. Cô sẽ cố gắng giúp em dựa trên những kiến thức đã được bổ sung.</p>`;
  }

  let firstCounselingReply = true;

  function sendMessage(){
    const text=input.value.trim();
    if(!text) return;
    addMessage(text,"user");
    input.value="";
    send.disabled=true;
    showTyping();
    setTimeout(()=>{
      document.getElementById("typingMessage")?.remove();

      let reply = answer(text);

      // Chỉ chèn thông tin liên hệ vào phần trả lời đầu tiên của chatbot.
      if(firstCounselingReply){
        reply = counselorInfo + reply;
        firstCounselingReply = false;
      }

      addMessage(reply,"bot");
      send.disabled=false;
      input.focus();
    },650);
  }

  send.addEventListener("click",sendMessage);
  input.addEventListener("keydown",e=>{
    if(e.key==="Enter"){e.preventDefault();sendMessage();}
  });

  document.querySelectorAll(".reply-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      input.value=btn.dataset.message;
      sendMessage();
    });
  });
});
</script>
</body>
</html>
